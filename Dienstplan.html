<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dienstplan</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='2' y='3' width='20' height='19' rx='4' fill='%23c2410c'/%3E%3Cpath d='M2 9h20' stroke='white' stroke-width='2'/%3E%3Cpath d='M7 13h4M7 17h8' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #f3f0ea; --card: #fff; --ink: #22201d; --muted: #6f6a62; --line: #e2dcd1; --line2: #eee9df;
  --accent: #c2410c; --accent-d: #9a3412; --accent-l: #fff1e6;
  --ok: #157f3b; --ok-l: #e5f5ea; --bad: #b42318; --bad-l: #fde9e7; --warn: #a15c07; --warn-l: #fdf1d8;
  --top: #2b221b; --r: 10px;
  --shadow: 0 1px 2px rgba(30, 20, 10, .06), 0 6px 18px rgba(30, 20, 10, .06);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-size: 14px; line-height: 1.4; }
h2, h3, h4 { margin: 0; line-height: 1.25; }
h3 { font-size: 15px; margin-bottom: 12px; }
h4 { font-size: 13px; margin: 18px 0 8px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
small { color: var(--muted); font-weight: 400; font-size: 11.5px; }
p { margin: 0 0 8px; }
button, input, select { font: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

/* ---- Kopf- und Fußzeile ---- */
header.top { background: var(--top); color: #f6efe6; display: flex; align-items: center; gap: 22px; padding: 0 20px; min-height: 56px; position: sticky; top: 0; z-index: 30; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; padding: 8px 0; }
.brand small { color: #f6efe6; opacity: .55; font-weight: 500; font-size: 12px; }
header nav { display: flex; gap: 4px; flex: 1; flex-wrap: wrap; }
.tab { background: none; border: 0; color: #e8dfd3; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 600; }
.tab:hover { background: rgba(255, 255, 255, .1); }
.tab.on { background: var(--accent); color: #fff; }
#foot { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-top: 1px solid var(--line); padding: 6px 20px; font-size: 12px; color: var(--muted); z-index: 20; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 2px; }
.dot.ok { background: #22a355; } .dot.warn { background: #f59e0b; } .dot.bad { background: #dc2626; }
.sepdot { margin: 0 6px; opacity: .5; }
.link { background: none; border: 0; color: var(--accent); font-weight: 600; cursor: pointer; text-decoration: underline; padding: 0; }
main { max-width: 1560px; margin: 0 auto; padding: 18px 20px 70px; }

/* ---- Bausteine ---- */
.card { background: var(--card); border-radius: var(--r); box-shadow: var(--shadow); padding: 16px 18px; margin-bottom: 16px; }
.two { display: grid; grid-template-columns: 1.6fr 1fr; gap: 16px; align-items: start; }
.two > .card { margin-bottom: 0; }
.toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.tools, .weeknav, .monthnav, .filters { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.weeklabel, .monthlabel { font-size: 17px; font-weight: 700; min-width: 210px; text-align: center; }
.monthlabel { min-width: 150px; }
.filters label { display: flex; align-items: center; gap: 6px; color: var(--muted); font-weight: 600; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; background: #fff; border: 1px solid #d5cec1; color: var(--ink); padding: 8px 14px; border-radius: 9px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.btn:hover { background: #faf7f1; border-color: #c4bcac; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: var(--accent-d); }
.btn.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.danger.ghost { background: #fff; color: var(--bad); border-color: #f0c4bf; }
.btn.danger.ghost:hover { background: var(--bad-l); }
.btn.ghost.light { background: transparent; border-color: rgba(255, 255, 255, .25); color: #f6efe6; }
.btn.ghost.light:hover { background: rgba(255, 255, 255, .1); }
.btn.icon { padding: 8px 11px; }
.btn.sm { padding: 5px 10px; font-size: 13px; }
.icon-btn { background: none; border: 0; cursor: pointer; color: var(--muted); padding: 6px 8px; border-radius: 7px; font-size: 14px; }
.icon-btn:hover { background: #f0ebe1; color: var(--bad); }
.row-btns { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
.muted { color: var(--muted); } .pad { padding: 8px 2px; } .mt { margin-top: 12px; }
.tip { color: var(--muted); font-size: 12.5px; margin: 12px 0 0; }
.note { padding: 9px 12px; border-radius: 8px; background: #f3f0ea; font-size: 13px; }
.note.warn { background: var(--warn-l); color: var(--warn); }
.lead { color: var(--muted); }

input[type=text], input[type=number], input[type=date], input[type=time], select {
  padding: 7px 9px; border: 1px solid #d5cec1; border-radius: 8px; background: #fff; color: var(--ink); min-width: 0; max-width: 100%;
}
input:focus, select:focus { outline: 2px solid var(--accent-l); border-color: var(--accent); }
input[type=color] { width: 38px; height: 34px; padding: 2px; border: 1px solid #d5cec1; border-radius: 8px; background: #fff; cursor: pointer; }
.fld { display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; color: var(--muted); font-weight: 600; }
.fld input, .fld select { font-weight: 400; font-size: 14px; }
.fld small { font-weight: 400; }
.fld.inline { flex-direction: row; align-items: center; margin-bottom: 10px; }
.fld.inline label { display: flex; gap: 8px; align-items: center; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
.grid2 .full { grid-column: 1 / -1; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 10px; }
.row2 label { display: flex; flex-direction: column; gap: 4px; font-weight: 600; color: var(--muted); font-size: 12.5px; }
.chks { display: flex; flex-wrap: wrap; gap: 4px 12px; }
.chk { display: flex; align-items: center; gap: 7px; cursor: pointer; font-weight: 500; color: var(--ink); font-size: 14px; }
.chk.sm { font-size: 13.5px; }
.chk input { width: 16px; height: 16px; accent-color: var(--accent); }
.presets { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
details.start { margin: 16px 0 8px; border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; background: #fbf9f5; }
details.start summary { cursor: pointer; font-weight: 600; }
details.start .grid2 { margin-top: 12px; }

.pdot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: middle; flex: none; }
.ptag { display: inline-block; margin-right: 10px; white-space: nowrap; font-size: 13px; }
.plus { color: var(--ok); } .minus { color: var(--bad); } .zero { color: var(--muted); }
.r { text-align: right; } .c { text-align: center; }

/* ---- Modal, Meldungen ---- */
.modal-back { position: fixed; inset: 0; background: rgba(28, 20, 12, .5); display: grid; place-items: center; z-index: 100; padding: 20px; }
.modal { background: #fff; border-radius: 14px; width: min(660px, 100%); max-height: calc(100vh - 40px); display: flex; flex-direction: column; box-shadow: 0 24px 70px rgba(0, 0, 0, .35); }
.modal.wide { width: min(840px, 100%); }
.modal-form { display: flex; flex-direction: column; min-height: 0; }
.modal-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; border-bottom: 1px solid var(--line); }
.modal-head h3 { margin: 0; font-size: 17px; }
.modal-body { padding: 16px 20px; overflow: auto; }
.modal-foot { display: flex; gap: 8px; align-items: center; padding: 12px 20px; border-top: 1px solid var(--line); background: #faf8f4; border-radius: 0 0 14px 14px; }
.modal-foot .sp { flex: 1; }
.confirm-text { font-size: 15px; margin: 0; }
.toast { position: fixed; left: 50%; bottom: 54px; transform: translate(-50%, 20px); background: var(--top); color: #fff; padding: 11px 18px; border-radius: 10px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; max-width: min(680px, 92vw); z-index: 200; box-shadow: 0 8px 30px rgba(0, 0, 0, .3); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.bad { background: var(--bad); }
#busy { position: fixed; inset: 0; background: rgba(243, 240, 234, .8); display: grid; place-items: center; z-index: 300; }
.busy-box { background: #fff; padding: 22px 30px; border-radius: 14px; box-shadow: var(--shadow); display: flex; align-items: center; gap: 14px; font-weight: 600; }
.spin { width: 22px; height: 22px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---- Dienstplan ---- */
.print-title { display: none; }
.planwrap { padding: 0; overflow: auto; }
table.plan { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 1040px; table-layout: fixed; }
.plan th, .plan td { border-bottom: 1px solid var(--line2); border-right: 1px solid var(--line2); }
.plan thead th { background: #faf7f1; padding: 8px 4px; text-align: center; font-weight: 600; vertical-align: top; }
.plan th.c-emp { width: 176px; text-align: left; padding: 6px 10px; background: #fff; position: sticky; left: 0; z-index: 2; }
.plan thead th.c-emp { background: #faf7f1; z-index: 3; }
.plan th.c-wk, .plan td.wk { width: 112px; }
.plan .en { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.plan .en em { font-weight: 400; color: var(--muted); font-size: 12px; }
.plan .es { color: var(--muted); font-size: 12px; font-weight: 400; }
.plan .dh .wd { font-weight: 700; } .plan .dh .dt { color: var(--muted); font-weight: 500; }
.plan .dh.today { background: var(--accent-l); box-shadow: inset 0 -3px 0 var(--accent); }
.plan .tag { display: block; font-size: 10.5px; font-weight: 600; margin-top: 2px; line-height: 1.2; }
.plan .tag.hol { color: var(--bad); } .plan .tag.cls { color: var(--muted); }
.plan tr.grp td { background: #faf7f1; font-weight: 600; font-size: 12px; padding: 5px 10px; color: var(--muted); border-right: 0; }
.plan td.cell { height: 60px; padding: 4px; vertical-align: middle; cursor: pointer; position: relative; }
.plan td.cell:hover { background: #fff8ef; outline: 2px solid var(--accent); outline-offset: -2px; }
.plan td.cell.today { background: #fffaf5; }
.plan td.cell.closed { background: repeating-linear-gradient(45deg, #f6f3ee, #f6f3ee 6px, #efebe4 6px, #efebe4 12px); }
.plan td.cell.empty:hover::after { content: '+'; position: absolute; inset: 0; display: grid; place-items: center; font-size: 24px; color: var(--accent); }
.plan td.wk { text-align: center; font-size: 13px; padding: 4px; border-right: 0; }
.plan td.wk small { display: block; font-weight: 700; font-size: 12px; }
.plan thead th.c-wk small { display: block; font-weight: 400; }
.chip { border-left: 4px solid var(--pc); background: var(--pb); border-radius: 6px; padding: 3px 7px; margin: 1px 0; position: relative; }
.chip .t { font-weight: 700; font-size: 12.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.chip .s { font-size: 11px; color: #5b564e; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip.man::after { content: ''; position: absolute; top: 5px; right: 5px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.absc { border-radius: 6px; padding: 9px 6px; text-align: center; font-weight: 600; font-size: 12px; }
.a-urlaub { background: #dbeafe; color: #1e40af; } .a-krank { background: #fee2e2; color: #991b1b; }
.a-za { background: #e5e7eb; color: #374151; } .a-frei { background: #f3f0ea; color: var(--muted); border: 1px dashed #cfc8ba; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12px; color: var(--muted); margin: -4px 4px 16px; align-items: center; }
.legend b { color: var(--ink); } .legend .sep { opacity: .4; }
table.cov { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.cov th, .cov td { border-bottom: 1px solid var(--line2); padding: 6px 5px; text-align: center; }
.cov thead th { color: var(--muted); font-weight: 600; font-size: 12px; }
.cov tbody th { text-align: left; font-weight: 600; white-space: nowrap; }
.cov thead th:first-child small { display: block; font-weight: 400; }
.cov td.na { color: #bbb4a6; }
.cov tr.tot th, .cov tr.tot td { border-top: 2px solid var(--line); }
.pill { display: inline-block; padding: 1px 7px; border-radius: 999px; font-weight: 700; font-size: 11px; margin: 1px 2px; white-space: nowrap; }
.pill.ok { background: var(--ok-l); color: var(--ok); } .pill.bad { background: var(--bad-l); color: var(--bad); }
ul.hints { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; }
ul.hints li { display: flex; gap: 8px; padding: 7px 10px; border-radius: 8px; font-size: 13px; }
ul.hints li span { flex: none; font-weight: 700; }
ul.hints li.ok { background: var(--ok-l); color: var(--ok); } ul.hints li.bad { background: var(--bad-l); color: var(--bad); } ul.hints li.warn { background: var(--warn-l); color: var(--warn); }
.welcome { max-width: 720px; margin: 30px auto; padding: 26px 30px; }
.welcome h2 { font-size: 22px; margin-bottom: 10px; }
.welcome ol { padding-left: 20px; line-height: 1.7; } .welcome ol li { margin-bottom: 4px; }

/* ---- Tabellen (Mitarbeiter, Einstellungen, Abwesenheiten) ---- */
.tablewrap { overflow: auto; }
table.list { width: 100%; border-collapse: collapse; }
.list th { text-align: left; color: var(--muted); font-size: 12px; font-weight: 600; padding: 7px 10px; border-bottom: 2px solid var(--line); white-space: nowrap; }
.list th.r { text-align: right; }
.list td { padding: 9px 10px; border-bottom: 1px solid var(--line2); vertical-align: middle; }
.list td small { display: block; }
.list tr.click { cursor: pointer; } .list tr.click:hover td { background: #fff8ef; }
.list.cfg td { padding: 6px 8px; } .list.cfg td:first-child b { white-space: nowrap; } .list.cfg input[type=text] { width: 100%; min-width: 120px; } .list.cfg input[type=number] { width: 84px; }
code { background: #f3f0ea; padding: 1px 5px; border-radius: 5px; font-size: 12.5px; }
.alignend { display: flex; align-items: flex-end; }
.rowhint { font-size: 12px; white-space: nowrap; }
.abadge { display: inline-block; padding: 2px 9px; border-radius: 999px; font-weight: 600; font-size: 12px; }
.rowset { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; max-width: 520px; }
.rs { display: flex; gap: 8px; align-items: center; } .rs input[type=text] { flex: 1; }
.reqt th, .reqt td { text-align: center; padding: 6px 4px; } .reqt tbody th { text-align: left; white-space: nowrap; padding-left: 8px; }
.reqt .off { opacity: .4; }
.reqt .fs { display: flex; gap: 4px; justify-content: center; }
.reqt .fs label { display: flex; align-items: center; gap: 2px; font-size: 11px; font-weight: 700; color: var(--muted); }
.reqt .fs input { width: 46px; padding: 5px 4px; text-align: center; }
.settings .card { max-width: 1000px; }

/* ---- Dienst bearbeiten ---- */
.seg { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.segbtn { position: relative; }
.segbtn input { position: absolute; opacity: 0; inset: 0; }
.segbtn span { display: inline-block; padding: 7px 12px; border: 1px solid #d5cec1; border-radius: 8px; cursor: pointer; background: #fff; font-weight: 600; }
.segbtn input:checked + span { background: var(--accent); border-color: var(--accent); color: #fff; }
.segbtn input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.erow { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
.erow .dash { color: var(--muted); }
.erow .pz { display: flex; align-items: center; gap: 5px; color: var(--muted); font-size: 13px; }
.erow input[type=number] { width: 64px; }

/* ---- Auswertung ---- */
.report { display: flex; flex-direction: column; align-items: center; }
.rpage { background: #fff; border-radius: var(--r); box-shadow: var(--shadow); padding: 16px 20px 20px; margin-bottom: 18px; width: 100%; max-width: 1180px; }
.rp-head { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--line); padding-bottom: 6px; margin-bottom: 12px; }
.rp-head b { color: var(--ink); }
.rpage h2 { font-size: 18px; margin: 4px 0 14px; }
.sheets { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; align-items: start; }
.sh-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
.sh-head b { font-size: 15px; } .sh-head span { color: var(--muted); margin-left: 10px; font-size: 12px; } .sh-per { font-weight: 600; color: var(--muted); }
.sheet table { width: 100%; border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; }
.sheet th, .sheet td { border: 1px solid #d9d2c4; padding: 2px 6px; white-space: nowrap; }
.sheet th { background: #f4f0e8; text-align: left; font-size: 11px; }
.sheet table { table-layout: fixed; }
.sheet th:nth-child(1) { width: 13%; } .sheet th:nth-child(2), .sheet th:nth-child(3) { width: 13%; } .sheet th:nth-child(4) { width: 10%; } .sheet th:nth-child(5) { width: 12%; }
.sheet th.r, .sheet td.r { text-align: right; }
.sheet td.nt { white-space: normal; font-size: 11px; color: #4b463f; }
.sheet tr.we td { background: #f7f3eb; } .sheet tr.ab td { background: #eef4ff; } .sheet tr.na td { color: #b5aea1; background: #faf8f4; }
.sheet tr.hd td:first-child { color: var(--bad); font-weight: 700; }
.sheet tr.sum td { background: #f4f0e8; font-weight: 700; }
.sum-table { width: 100%; border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.sum-table th, .sum-table td { border: 1px solid #d9d2c4; padding: 5px 7px; }
.sum-table thead th { background: #f4f0e8; font-size: 11.5px; text-align: left; vertical-align: bottom; }
.sum-table thead th.r { text-align: right; } .sum-table thead th.grp { text-align: center; }
.sum-table td small { display: block; }
.sum-table td:first-child { white-space: nowrap; }
.sum-table thead th { white-space: nowrap; }
.sum-table tfoot td { font-weight: 700; background: #f4f0e8; }
.exit-h { margin: 22px 0 8px; font-size: 14px; }
.sum-table.exit td:nth-child(3) { white-space: nowrap; }
.notes { margin-top: 14px; font-size: 11.5px; color: var(--muted); line-height: 1.5; }

@media (max-width: 1100px) { .two { grid-template-columns: 1fr; } .sheets { grid-template-columns: 1fr; } }
@media (max-width: 1000px) { header nav { order: 3; flex: 1 0 100%; padding-bottom: 6px; } .brand { padding: 6px 0; } header.top { gap: 4px 16px; } .top-tools { margin-left: auto; } }
@media (max-width: 720px) { .grid2, .row2 { grid-template-columns: 1fr; } main { padding: 12px 12px 70px; } header.top { padding: 0 12px; gap: 8px; } }

/* ---- Druck (A4 quer) ---- */
@media print {
  @page { size: A4 landscape; margin: 9mm; }
  html, body { background: #fff; font-size: 11px; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  header.top, #foot, .toolbar, .no-print, .tip, #toast, #modal-root, #busy, .legend .sep { display: none !important; }
  main { padding: 0; max-width: none; }
  .card { box-shadow: none; padding: 0; margin: 0 0 8mm; border-radius: 0; }
  .two { display: block; }
  .print-title { display: block; font-size: 15px; font-weight: 700; margin-bottom: 6px; }
  .planwrap { overflow: visible; }
  table.plan { min-width: 0; }
  .plan td.cell { height: 32px; padding: 2px; }
  .plan td.cell:hover { outline: none; background: none; }
  .plan th.c-emp { position: static; padding: 2px 8px; }
  .plan thead th { padding: 4px 2px; font-size: 10px; }
  .plan tr.grp td { padding: 2px 8px; font-size: 9.5px; }
  .plan .en { font-size: 10.5px; } .plan .es { font-size: 8.5px; }
  .plan td.wk { font-size: 10px; padding: 2px; } .plan td.wk small { font-size: 9px; }
  .plan .tag { font-size: 8.5px; }
  .chip { padding: 1px 5px; margin: 0; }
  .chip .t { font-size: 10px; } .chip .s { font-size: 8px; }
  .legend { font-size: 9px; margin: 0 0 4mm; }
  table.cov { font-size: 9.5px; } .cov th, .cov td { padding: 2px 3px; } .pill { font-size: 8.5px; padding: 0 5px; margin: 0 1px; }
  .card h3 { font-size: 11px; margin-bottom: 3px; }
  .card { margin-bottom: 4mm; }
  .report { display: block; }

<body>
<noscript><p style="padding:20px">Dieses Programm benötigt JavaScript. Bitte JavaScript im Browser aktivieren.</p></noscript>
<header class="top no-print" id="top"></header>
<main id="main"></main>
<footer id="foot" class="no-print"></footer>
<div id="modal-root"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="busy" hidden><div class="busy-box"><div class="spin"></div><div class="busy-msg">Bitte warten …</div></div></div>
<script>
'use strict';
/* ===== Hilfsfunktionen: Datum, Zeit, Formatierung ===== */

const WD_SHORT = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'];
const WD_LONG = ['Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag', 'Sonntag'];
const MONTHS = ['Jänner', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
const DAY_MS = 86400000;
const EMPTY = Object.freeze([]);

const p2 = n => (n < 10 ? '0' : '') + n;

// Tage werden intern als fortlaufende Tagesnummer (dn) geführt, gespeichert als "JJJJ-MM-TT".
function dnOf(y, m, d) { return Math.round(Date.UTC(y, m - 1, d) / DAY_MS); }
const isoCache = new Map();
function fromDn(dn) {
  let s = isoCache.get(dn);
  if (!s) {
    const t = new Date(dn * DAY_MS);
    s = t.getUTCFullYear() + '-' + p2(t.getUTCMonth() + 1) + '-' + p2(t.getUTCDate());
    isoCache.set(dn, s);
  }
  return s;
}
function toDn(iso) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
  return m ? dnOf(+m[1], +m[2], +m[3]) : NaN;
}
function ymd(dn) {
  const t = new Date(dn * DAY_MS);
  return { y: t.getUTCFullYear(), m: t.getUTCMonth() + 1, d: t.getUTCDate() };
}
const wdOf = dn => (((dn + 3) % 7) + 7) % 7; // Montag = 0
const mondayOf = dn => dn - wdOf(dn);
function todayDn() {
  const n = new Date();
  return dnOf(n.getFullYear(), n.getMonth() + 1, n.getDate());
}
const monthStart = (y, m) => dnOf(y, m, 1);
const monthEnd = (y, m) => dnOf(y, m + 1, 1) - 1;
function isoWeek(dn) {
  const thu = dn - wdOf(dn) + 3;
  const y = ymd(thu).y;
  return { week: Math.floor((thu - dnOf(y, 1, 1)) / 7) + 1, year: y };
}

// Formatierung (deutsch)
function fmtDate(dn) { const t = ymd(dn); return p2(t.d) + '.' + p2(t.m) + '.' + t.y; }
function fmtDM(dn) { const t = ymd(dn); return p2(t.d) + '.' + p2(t.m) + '.'; }
function fmtNum(x, dec) {
  dec = dec === undefined ? 2 : dec;
  const f = Math.pow(10, dec);
  return (Math.round((+x || 0) * f) / f).toFixed(dec).replace('.', ',');
}
const fmtH = x => fmtNum(x, 2);
function fmtSigned(x) {
  const v = Math.round((+x || 0) * 100) / 100;
  return (v > 0 ? '+' : v < 0 ? '-' : '') + fmtNum(Math.abs(v), 2);
}
function fmtDaysExact(x) { // Urlaubstage genau (bis 2 Nachkommastellen, ohne überflüssige Nullen)
  return String(Math.round((+x || 0) * 100) / 100).replace('.', ',');
}
function fmtDays(x) {
  const v = Math.round((+x || 0) * 10) / 10;
  return String(v).replace('.', ',');
}

// Uhrzeiten als "HH:MM" <-> Minuten seit Mitternacht
function parseHM(s) {
  const m = /^(\d{1,2}):(\d{2})$/.exec(s || '');
  return m ? +m[1] * 60 + +m[2] : NaN;
}
function fmtHM(min) {
  min = ((Math.round(min) % 1440) + 1440) % 1440;
  return p2(Math.floor(min / 60)) + ':' + p2(min % 60);
}
// Dienst von/bis; endet er "vor" dem Beginn, geht er über Mitternacht
function shiftSpan(start, end) {
  const s = parseHM(start);
  let e = parseHM(end);
  if (e <= s) e += 1440;
  return { s, e };
}
function netHours(start, end, pause) {
  const { s, e } = shiftSpan(start, end);
  return Math.max(0, (e - s - (+pause || 0)) / 60);
}

// Sonstiges
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function uid(prefix) {
  return (prefix || 'x') + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-3);
}
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const clone = o => JSON.parse(JSON.stringify(o));
function tint(hex, a) {
  const n = parseInt(String(hex).replace('#', ''), 16) || 0;
  return 'rgba(' + (n >> 16) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
}
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* ===== Gesetzliche Feiertage Österreich ===== */

// Ostersonntag (Gaußsche Osterformel, gregorianisch)
function easterDn(y) {
  const a = y % 19, b = Math.floor(y / 100), c = y % 100;
  const d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25);
  const g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30;
  const i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7;
  const m = Math.floor((a + 11 * h + 22 * l) / 451);
  const month = Math.floor((h + l - 7 * m + 114) / 31);
  const day = ((h + l - 7 * m + 114) % 31) + 1;
  return dnOf(y, month, day);
}

const _holCache = new Map();
function holidaysAT(y) {
  if (_holCache.has(y)) return _holCache.get(y);
  const E = easterDn(y);
  const list = [
    [dnOf(y, 1, 1), 'Neujahr'],
    [dnOf(y, 1, 6), 'Heilige Drei Könige'],
    [E + 1, 'Ostermontag'],
    [dnOf(y, 5, 1), 'Staatsfeiertag'],
    [E + 39, 'Christi Himmelfahrt'],
    [E + 50, 'Pfingstmontag'],
    [E + 60, 'Fronleichnam'],
    [dnOf(y, 8, 15), 'Mariä Himmelfahrt'],
    [dnOf(y, 10, 26), 'Nationalfeiertag'],
    [dnOf(y, 11, 1), 'Allerheiligen'],
    [dnOf(y, 12, 8), 'Mariä Empfängnis'],
    [dnOf(y, 12, 25), 'Christtag'],
    [dnOf(y, 12, 26), 'Stefanitag'],
  ].map(([dn, name]) => ({ dn, name })).sort((a, b) => a.dn - b.dn);
  const map = new Map(list.map(h => [h.dn, h.name]));
  const res = { list, map };
  _holCache.set(y, res);
  return res;
}
function holidayName(dn) {
  return holidaysAT(ymd(dn).y).map.get(dn) || null;
}

/* ===== Datenmodell, Standardwerte, Zugriffshilfen ===== */

const POS_COLORS = ['#e8590c', '#2f9e44', '#1971c2', '#9c36b5', '#f08c00', '#0c8599', '#c2255c', '#5c7cfa', '#868e96'];

// Vorschlagswerte je Anstellungsart (Wochenstunden, Arbeitstage pro Woche)
const EMP_TYPES = {
  'Vollzeit': { weekly: 40, days: 5 },
  'Teilzeit': { weekly: 25, days: 4 },
  'Geringfügig': { weekly: 12, days: 2 },
  'Aushilfe': { weekly: 12, days: 2 },
  'Lehrling': { weekly: 40, days: 5 },
};
const COMPANY_NAME = 'Tiziano Restaurant GmbH';
const ABS_TYPES = { urlaub: 'Urlaub', krank: 'Krankenstand', za: 'Zeitausgleich', frei: 'Frei (fix)' };

let state = null;   // aktueller Datenbestand
let stateVer = 0;   // Änderungszähler (für Zwischenspeicher)
const touch = () => { stateVer++; };

function defaultSettings() {
  const s = {
    name: COMPANY_NAME,
    positions: [
      { id: 'pos_pizza', name: 'Pizzakoch', color: POS_COLORS[0] },
      { id: 'pos_kueche', name: 'Küche / Koch', color: POS_COLORS[1] },
      { id: 'pos_service', name: 'Service', color: POS_COLORS[2] },
      { id: 'pos_abwasch', name: 'Abwasch / Küchenhilfe', color: POS_COLORS[3] },
    ],
    // covers: F = deckt die Früh-Hälfte des Tages ab, S = Spät-Hälfte, FS = beide (durchgehend)
    shifts: [
      { id: 'sh_frueh', name: 'Frühdienst', start: '10:00', end: '17:00', pause: 30, covers: 'F' },
      { id: 'sh_spaet', name: 'Spätdienst', start: '17:00', end: '23:30', pause: 30, covers: 'S' },
      { id: 'sh_durch', name: 'Durchgehend', start: '11:00', end: '21:00', pause: 60, covers: 'FS' },
    ],
    openDays: [false, true, true, true, true, true, true], // Montag = Ruhetag
    req: {},            // Mindestbesetzung: req[positionId][wochentag] = [früh, spät]
    minPersons: 4,      // mindestens so viele Personen pro Öffnungstag
    minRestH: 11,       // Mindestruhezeit zwischen zwei Diensten (Stunden)
    maxConsec: 6,       // maximal so viele Arbeitstage in Folge
    fairWeekends: true,
    closedHolidays: {}, // "JJJJ-MM-TT" -> true: Restaurant an diesem Feiertag geschlossen
    closures: [],       // Betriebsruhe: { id, from, to, note }
  };
  ensureReq(s);
  return s;
}

function ensureReq(s) {
  s.req = s.req || {};
  for (const p of s.positions) {
    let r = s.req[p.id];
    if (!Array.isArray(r) || r.length !== 7) r = s.req[p.id] = [0, 1, 2, 3, 4, 5, 6].map(() => [1, 1]);
    for (let k = 0; k < 7; k++) {
      if (!Array.isArray(r[k])) r[k] = [1, 1];
      r[k][0] = Math.max(0, r[k][0] | 0);
      r[k][1] = Math.max(0, r[k][1] | 0);
    }
  }
}

function defaultState() {
  return { v: 1, settings: defaultSettings(), employees: [], absences: [], plan: {} };
}

// Fehlende Felder ergänzen (ältere Sicherungen, händisch veränderte Dateien)
function migrate(s) {
  if (!s || typeof s !== 'object' || !Array.isArray(s.employees) || !s.settings) throw new Error('Ungültige Datei');
  const d = defaultSettings();
  s.settings = Object.assign({}, d, s.settings);
  if (!s.settings.name || s.settings.name === 'Restaurant') s.settings.name = COMPANY_NAME; // früherer Platzhalter
  if (!Array.isArray(s.settings.positions) || !s.settings.positions.length) s.settings.positions = d.positions;
  if (!Array.isArray(s.settings.shifts) || !s.settings.shifts.length) s.settings.shifts = d.shifts;
  if (!Array.isArray(s.settings.openDays) || s.settings.openDays.length !== 7) s.settings.openDays = d.openDays;
  s.settings.closedHolidays = s.settings.closedHolidays || {};
  s.settings.closures = s.settings.closures || [];
  ensureReq(s.settings);
  s.absences = Array.isArray(s.absences) ? s.absences : [];
  s.plan = s.plan && typeof s.plan === 'object' ? s.plan : {};
  const tpl = newEmployee('Vollzeit');
  s.employees = s.employees.map(e => Object.assign({}, tpl, e, { id: e.id || uid('e') }));
  s.v = 1;
  return s;
}

function newEmployee(type, o) {
  const t = EMP_TYPES[type] || EMP_TYPES['Vollzeit'];
  return Object.assign({
    id: uid('e'), name: '', type: type || 'Vollzeit',
    weekly: t.weekly, days: t.days, vac: 5 * t.days,
    vacRest: null,        // Resturlaub (Tage) per Stichtag; null = noch nicht angegeben (dann gilt der volle Anspruch)
    vacCarry: 0, vacUsedBefore: 0, balStart: 0, trackFrom: fromDn(todayDn()), // trackFrom = erster gezählter Tag = Stichtag + 1
    main: '', alt: [], allowed: null, offDays: [], from: '', to: '', active: true, note: '',
  }, o || {});
}

/* ---------- Zugriff / Zwischenspeicher ---------- */

let _idx = null, _idxVer = -1;
function getIndex() {
  if (_idx && _idxVer === stateVer) return _idx;
  const idx = { emp: new Map(), pos: new Map(), shift: new Map(), abs: new Map(), closures: [], planEmp: new Map() };
  state.employees.forEach(e => idx.emp.set(e.id, e));
  state.settings.positions.forEach(p => idx.pos.set(p.id, p));
  state.settings.shifts.forEach(s => idx.shift.set(s.id, s));
  // Abwesenheiten je Person und Tag (Krank vor Urlaub vor Zeitausgleich)
  const prio = { krank: 4, urlaub: 3, za: 2, frei: 1 };
  for (const a of state.absences) {
    const f = toDn(a.from), t = toDn(a.to);
    if (isNaN(f) || isNaN(t)) continue;
    let m = idx.abs.get(a.emp);
    if (!m) idx.abs.set(a.emp, (m = new Map()));
    for (let d = f; d <= t && d - f < 800; d++) {
      const old = m.get(d);
      if (!old || prio[a.type] > prio[old]) m.set(d, a.type);
    }
  }
  idx.closures = state.settings.closures
    .map(c => ({ a: toDn(c.from), b: toDn(c.to), note: c.note || 'Betriebsruhe' }))
    .filter(c => !isNaN(c.a) && !isNaN(c.b));
  for (const iso in state.plan) {
    const dn = toDn(iso);
    for (const en of state.plan[iso]) {
      const key = en.emp + '|' + dn;
      const arr = idx.planEmp.get(key);
      if (arr) arr.push(en); else idx.planEmp.set(key, [en]);
    }
  }
  _idx = idx; _idxVer = stateVer;
  return idx;
}
const getEmp = id => getIndex().emp.get(id);
const getPos = id => getIndex().pos.get(id);
const getShift = id => getIndex().shift.get(id);
const entriesOf = (empId, dn) => getIndex().planEmp.get(empId + '|' + dn) || EMPTY;
const entHours = en => netHours(en.start, en.end, en.pause);
const dayEntries = dn => state.plan[fromDn(dn)] || EMPTY;
const absenceOf = (empId, dn) => { const m = getIndex().abs.get(empId); return m ? m.get(dn) || null : null; };

// Öffnungsstatus eines Tages
function dayStatus(dn) {
  const S = state.settings, wd = wdOf(dn);
  const holiday = holidayName(dn);
  const ruhetag = !S.openDays[wd];
  let closure = null;
  for (const c of getIndex().closures) if (dn >= c.a && dn <= c.b) { closure = c.note; break; }
  const closedHoliday = !!(holiday && S.closedHolidays[fromDn(dn)]);
  const open = !ruhetag && !closure && !closedHoliday;
  let closedReason = null;
  if (!open) closedReason = ruhetag ? 'Ruhetag' : closure ? closure : holiday + ' (geschlossen)';
  return { wd, holiday, ruhetag, closure, closedHoliday, open, closedReason };
}

/* ---------- Dienste (Einträge im Plan) ---------- */

const covMask = c => (String(c || '').indexOf('F') >= 0 ? 1 : 0) | (String(c || '').indexOf('S') >= 0 ? 2 : 0);
const covStr = m => (m & 1 ? 'F' : '') + (m & 2 ? 'S' : '');
// Wird ein eigener Dienst eingetragen, ergibt sich die Abdeckung aus der Uhrzeit (Tagesmitte 17:00)
function autoCov(start, end) {
  const { s, e } = shiftSpan(start, end);
  return covStr((s < 17 * 60 ? 1 : 0) | (e > 17 * 60 ? 2 : 0));
}
function makeEntry(empId, posId, sh, manual) {
  return {
    id: uid('n'), emp: empId, pos: posId, shift: sh.id || 'custom',
    start: sh.start, end: sh.end, pause: +sh.pause || 0,
    cov: sh.covers || autoCov(sh.start, sh.end), manual: !!manual,
  };
}
function addEntry(dn, entry) {
  const iso = fromDn(dn);
  (state.plan[iso] = state.plan[iso] || []).push(entry);
  touch();
}
function removeEntriesOf(empId, fromD, toD) {
  let n = 0;
  for (let d = fromD; d <= toD; d++) {
    const iso = fromDn(d), arr = state.plan[iso];
    if (!arr) continue;
    const keep = arr.filter(en => en.emp !== empId);
    n += arr.length - keep.length;
    if (keep.length) state.plan[iso] = keep; else delete state.plan[iso];
  }
  if (n) touch();
  return n;
}

// Alle Dienste und Abwesenheiten einer Person nach einem Stichtag entfernen (z. B. nach dem Austritt)
function removeAfter(empId, dn) {
  let n = 0;
  for (const iso in state.plan) {
    if (toDn(iso) <= dn) continue;
    const keep = state.plan[iso].filter(en => en.emp !== empId);
    n += state.plan[iso].length - keep.length;
    if (keep.length) state.plan[iso] = keep; else delete state.plan[iso];
  }
  state.absences = state.absences.flatMap(a => {
    if (a.emp !== empId || toDn(a.to) <= dn) return [a];
    if (toDn(a.from) > dn) return [];
    return [Object.assign({}, a, { to: fromDn(dn) })];
  });
  touch();
  return n;
}

/* ---------- Abwesenheiten ---------- */

// Benachbarte Abwesenheiten gleicher Art einer Person zusammenfassen
function mergeAbsences(empId) {
  const mine = state.absences.filter(a => a.emp === empId).sort((a, b) => toDn(a.from) - toDn(b.from));
  const merged = [];
  for (const a of mine) {
    const last = merged[merged.length - 1];
    if (last && last.type === a.type && (last.note || '') === (a.note || '') && toDn(a.from) <= toDn(last.to) + 1) {
      if (toDn(a.to) > toDn(last.to)) last.to = a.to;
    } else merged.push(Object.assign({}, a));
  }
  state.absences = state.absences.filter(a => a.emp !== empId).concat(merged);
  touch();
}
// Für einen einzelnen Tag die Abwesenheit setzen (type = null: Tag frei von Abwesenheit)
function setAbsenceDay(empId, dn, type) {
  const out = [];
  for (const a of state.absences) {
    const f = toDn(a.from), t = toDn(a.to);
    if (a.emp !== empId || dn < f || dn > t) { out.push(a); continue; }
    if (f < dn) out.push(Object.assign({}, a, { id: uid('a'), to: fromDn(dn - 1) }));
    if (t > dn) out.push(Object.assign({}, a, { id: uid('a'), from: fromDn(dn + 1) }));
  }
  state.absences = out;
  if (type) state.absences.push({ id: uid('a'), emp: empId, from: fromDn(dn), to: fromDn(dn), type, note: '' });
  mergeAbsences(empId);
}

/* ---------- Mitarbeiter entfernen ---------- */

// Personen samt Diensten und Abwesenheiten endgültig entfernen
function deleteEmployees(ids) {
  const set = new Set(ids);
  state.employees = state.employees.filter(e => !set.has(e.id));
  state.absences = state.absences.filter(a => !set.has(a.emp));
  for (const iso in state.plan) {
    const keep = state.plan[iso].filter(en => !set.has(en.emp));
    if (keep.length) state.plan[iso] = keep; else delete state.plan[iso];
  }
  touch();
}

// Frühere Programmversionen enthielten Muster-Mitarbeiter (Beispieldaten). Diese Namen dienen nur dazu,
// solche Reste in bereits gespeicherten Daten zu erkennen und auf Wunsch zu entfernen.
const LEGACY_SAMPLE_NAMES = ['Marco Rossi', 'Luca Bianchi', 'Giulia Ferrari', 'Stefan Huber', 'Anna Gruber',
  'Sabine Wagner', 'Elena Novak', 'Tobias Berger', 'Mehmet Yilmaz', 'Lisa Steiner'];
function legacySampleEmployees() {
  const found = state.employees.filter(e => LEGACY_SAMPLE_NAMES.indexOf(e.name) >= 0);
  return found.length >= 5 ? found : []; // erst ab 5 Treffern, damit einzelne echte Mitarbeiter mit gleichem Namen nicht betroffen sind
}

/* ===== Stunden- und Urlaubsrechnung =====
 *
 * Soll     = Wochenstunden / 7 je Kalendertag (im Zeitraum der Beschäftigung / Zeitkonto-Führung)
 * gearbeitet = Summe der Dienste (von–bis abzüglich Pause)
 * Gutschrift = Urlaub, Krankenstand und Feiertag/Betriebsruhe: je Tag Wochenstunden / Arbeitstage pro Woche,
 *              höchstens so viele Tage pro Woche, bis (gearbeitete Tage + Gutschrifttage) = Arbeitstage pro Woche.
 * Ist      = gearbeitet + Gutschrift
 * Saldo    = Ist - Soll   (Plus-/Minusstunden)
 * Zeitausgleich (ZA) zählt als freier Tag ohne Gutschrift und baut damit Plusstunden ab.
 */

// Wie zählt ein freier, regulärer Arbeitstag? 'hol' = Feiertag/Betriebsruhe (Stundengutschrift, kein Urlaubsabzug),
// 'abs' = Abwesenheit (Urlaub, Krank, Zeitausgleich), '' = gewöhnlicher freier Tag.
// Gesetzliche Feiertage werden nie auf den Urlaub angerechnet; eine Betriebsruhe mit eingetragenem Urlaub schon.
function offDayKind(st, absType) {
  const closed = !!(st.closure || st.closedHoliday);
  if ((st.holiday && (absType || closed)) || (closed && !absType)) return 'hol';
  return absType ? 'abs' : '';
}

function empWindow(emp) {
  const track = emp.trackFrom ? toDn(emp.trackFrom) : NaN;
  const from = emp.from ? toDn(emp.from) : NaN;
  const to = emp.to ? toDn(emp.to) : NaN;
  let a = Math.max(isNaN(track) ? -1e9 : track, isNaN(from) ? -1e9 : from);
  if (a < -1e8) a = dnOf(ymd(todayDn()).y, 1, 1);
  return { a, b: isNaN(to) ? 1e9 : to };
}

// Tagesdatensätze einer Person für a..b (einschließlich). Die Wochenlogik läuft über ganze Kalenderwochen.
function empDayRecords(emp, a, b) {
  const S = state.settings, win = empWindow(emp);
  const abs = getIndex().abs.get(emp.id);
  const C = Math.max(1, +emp.days || 5);
  const dayH = (+emp.weekly || 0) / C;
  const off = emp.offDays || EMPTY;
  const out = [];
  for (let ws = mondayOf(a); ws <= b; ws += 7) {
    const wk = [];
    let W = 0;
    for (let k = 0; k < 7; k++) {
      const dn = ws + k;
      const inWin = dn >= win.a && dn <= win.b;
      const r = { dn, inWin, cat: '', work: 0, credit: 0, soll: 0, vac: 0, sick: 0, za: 0, hol: 0, entries: EMPTY, abs: null };
      if (inWin) {
        r.soll = (+emp.weekly || 0) / 7;
        const ens = entriesOf(emp.id, dn);
        r.entries = ens;
        if (ens.length) {
          for (const en of ens) r.work += entHours(en);
          r.cat = 'work';
          W++;
        }
      }
      wk.push(r);
    }
    // Tage ohne Dienst: freie Tage, Abwesenheiten und Feiertage einordnen
    const hol = [], ab = [];
    for (const r of wk) {
      if (!r.inWin || r.cat === 'work') continue;
      const wd = wdOf(r.dn);
      const st = dayStatus(r.dn);
      const absType = abs ? abs.get(r.dn) || null : null;
      r.abs = absType;
      if (!S.openDays[wd] || off.indexOf(wd) >= 0) { r.cat = !S.openDays[wd] ? 'ruhetag' : 'frei'; continue; }
      if (absType === 'frei') { r.cat = 'frei'; continue; } // fix freigehalten: wie ein normaler freier Tag
      const kind = offDayKind(st, absType);
      if (kind === 'hol') hol.push(r);
      else if (kind === 'abs') ab.push(r);
      else r.cat = 'frei';
    }
    let R = Math.max(0, C - W); // freie Kapazität dieser Woche
    for (const r of hol) {
      if (R > 0) { R--; r.cat = 'feiertag'; r.hol = 1; r.credit = dayH; } else r.cat = 'nocredit';
    }
    for (const r of ab) {
      if (R <= 0) { r.cat = 'nocount'; continue; }
      R--;
      if (r.abs === 'urlaub') { r.cat = 'urlaub'; r.vac = 1; r.credit = dayH; }
      else if (r.abs === 'krank') { r.cat = 'krank'; r.sick = 1; r.credit = dayH; }
      else { r.cat = 'za'; r.za = 1; }
    }
    for (const r of wk) if (r.dn >= a && r.dn <= b) out.push(r);
  }
  return out;
}

function sumRecords(recs) {
  const t = { soll: 0, work: 0, cVac: 0, cSick: 0, cHol: 0, vacDays: 0, sickDays: 0, zaDays: 0, holDays: 0, workDays: 0 };
  for (const r of recs) {
    if (!r.inWin) continue;
    t.soll += r.soll;
    t.work += r.work;
    if (r.cat === 'work') t.workDays++;
    if (r.vac) { t.vacDays++; t.cVac += r.credit; }
    if (r.sick) { t.sickDays++; t.cSick += r.credit; }
    if (r.za) t.zaDays++;
    if (r.hol) { t.holDays++; t.cHol += r.credit; }
  }
  t.credit = t.cVac + t.cSick + t.cHol;
  t.ist = t.work + t.credit;
  t.saldo = t.ist - t.soll;
  return t;
}
const empTotals = (emp, a, b) => sumRecords(empDayRecords(emp, a, b));

// Zeitkonto: Startsaldo + alle Monate seit Beginn der Zeitkonto-Führung bis upTo
function empAccount(emp, upTo) {
  const win = empWindow(emp);
  const start = +emp.balStart || 0;
  if (win.a > upTo) return { saldo: 0, konto: start };
  const t = empTotals(emp, win.a, Math.min(upTo, win.b));
  return { saldo: t.saldo, konto: start + t.saldo };
}

/* ---------- Urlaub ----------
 * Urlaubsjahr = ab dem Jahrestag des Eintritts (ohne Eintrittsdatum: Kalenderjahr). Am Jahrestag wird der Jahresanspruch
 * neu gutgeschrieben, ein nicht verbrauchter Rest wird übertragen. Im Urlaubsjahr des Austritts gilt der Anspruch
 * aliquot (Tage des Arbeitsverhältnisses im Urlaubsjahr / Tage des Urlaubsjahres).
 */
const daysInMonth = (y, m) => monthEnd(y, m) - monthStart(y, m) + 1;
function vacAnchor(emp) { // [Monat, Tag] des Eintritts
  const f = emp.from ? toDn(emp.from) : NaN;
  if (isNaN(f)) return [1, 1];
  const t = ymd(f);
  return [t.m, t.d];
}
function anniversary(emp, y) { // Jahrestag im Jahr y (29.2. -> 28.2. in Nicht-Schaltjahren)
  const [m, d] = vacAnchor(emp);
  return dnOf(y, m, Math.min(d, daysInMonth(y, m)));
}
function vacYearStart(emp, dn) {
  const s = anniversary(emp, ymd(dn).y);
  return s <= dn ? s : anniversary(emp, ymd(dn).y - 1);
}
const vacYearEnd = (emp, start) => anniversary(emp, ymd(start).y + 1) - 1;

// Resturlaub per Stichtag (der Stichtag ist der Tag vor trackFrom, die Werte gelten zum Ende dieses Tages).
// Ältere Daten ohne vacRest verwenden weiter Vorjahresrest und bereits genommenen Urlaub.
const hasVacRest = emp => emp.vacRest != null && emp.vacRest !== '' && !isNaN(+emp.vacRest);
function vacRestOf(emp) { // Resturlaub per Stichtag, auch für ältere Daten
  return hasVacRest(emp) ? +emp.vacRest : (+emp.vacCarry || 0) + (+emp.vac || 0) - (+emp.vacUsedBefore || 0);
}
// Zerlegt den Stand in "Übertrag ins erste Urlaubsjahr" und "davon schon genommen"
function vacStartParts(emp, ys0) {
  if (!hasVacRest(emp)) return { carry: +emp.vacCarry || 0, before: +emp.vacUsedBefore || 0 };
  const R = +emp.vacRest, ent = +emp.vac || 0;
  const track = emp.trackFrom ? toDn(emp.trackFrom) : NaN, from = emp.from ? toDn(emp.from) : NaN;
  if (!isNaN(track) && !isNaN(from) && track - 1 < from) return { carry: 0, before: 0 }; // Stand vor dem Eintritt: nichts zu übernehmen
  if (!isNaN(track) && vacYearStart(emp, track - 1) < ys0) return { carry: R, before: 0 }; // Stand am Ende des Vorjahres: Übertrag
  return R <= ent ? { carry: 0, before: ent - R } : { carry: R - ent, before: 0 };
}

// Urlaubsstand zum Tag upTo: Anspruch + Übertrag - genommen im Urlaubsjahr, das upTo enthält.
// Liegt upTo auf oder nach dem Austritt, wird aliquot bis zum Austritt abgerechnet (final = true).
function vacationInfo(emp, upTo) {
  const win = empWindow(emp);
  const ref = Math.min(upTo, win.b);
  if (ref < win.a) return null;
  const final = win.b < 1e8 && upTo >= win.b;
  let ys = vacYearStart(emp, win.a);
  const ys0 = ys, parts = vacStartParts(emp, ys0);
  let carry = parts.carry;
  for (let guard = 0; guard < 80; guard++) {
    const ye = vacYearEnd(emp, ys), before = ys === ys0 ? parts.before : 0;
    if (ref <= ye) return vacYear(emp, ys, ye, carry, upTo, before, final);
    carry = vacYear(emp, ys, ye, carry, ye, before, false).rest;
    ys = ye + 1;
  }
  return null;
}
function vacYear(emp, ys, ye, carry, upTo, before, final) {
  const win = empWindow(emp);
  const a = Math.max(ys, win.a), b = Math.min(ye, win.b);
  let usedProg = 0, later = 0;
  if (a <= b) {
    for (const r of empDayRecords(emp, a, b)) if (r.vac) { if (r.dn <= upTo) usedProg++; else later++; }
  }
  const full = +emp.vac || 0, daysInYear = ye - ys + 1, endDay = Math.min(ye, win.b);
  const daysWorked = endDay - ys + 1;
  const entitlement = final ? full * daysWorked / daysInYear : full;
  const used = before + usedProg;
  const rest = carry + entitlement - used;
  return { yStart: ys, yEnd: ye, entitlement, fullEntitlement: full, carry, used, before, usedProg, later, rest, restAfterPlanned: rest - later, final, daysWorked, daysInYear, endDay };
}
// Abrechnung, falls der Mitarbeiter am Tag `exit` ausscheidet (auch als Vorschau vor dem Speichern)
function vacationSettlement(emp, exit) {
  return vacationInfo(Object.assign({}, emp, { to: fromDn(exit) }), exit);
}

// Lücke zwischen Stichtag und heute: Soll-Stunden ohne eingetragene Dienste ergeben Minusstunden.
// stand = Stichtag (dn); gerechnet wird von stand+1 bis gestern. Liefert null, wenn es keine Lücke gibt.
function standGap(emp, stand, today) {
  const a = stand + 1, b = today - 1;
  if (isNaN(stand) || a > b) return null;
  const temp = Object.assign({}, emp, { trackFrom: fromDn(a), active: true });
  const t = empTotals(temp, a, b);
  return { days: b - a + 1, soll: t.soll, ist: t.ist, saldo: t.saldo };
}

/* ===== Automatische Dienstplanung =====
 *
 * Eine Woche wird als Optimierungsproblem gelöst (Simulated Annealing):
 *  - jede Person hat pro Tag genau einen Dienst (Früh / Spät / Durchgehend ...) mit einer Position oder frei
 *  - hart bewertet: Mindestbesetzung je Position und Tageshälfte, Mindestanzahl Personen, Ruhezeit, Arbeitstage in Folge,
 *    Abwesenheiten, feste freie Tage, Positionen und erlaubte Dienste
 *  - weich bewertet: Wochenstunden (inkl. Urlaub/Krank-Gutschrift und bisherigem Zeitkonto), gleichmäßige Verteilung,
 *    zusammenhängende freie Tage, möglichst gleiche Dienstart, Hauptposition, faire Wochenenden
 * Manuell geänderte Dienste bleiben auf Wunsch unverändert; Tage außerhalb des Planungszeitraums werden nicht angefasst.
 */

const PW = { MISS: 1000, MINP: 900, REST: 400, CONSEC: 300, DAYS: 120, OVER: 11, UNDER: 8, LOST: 40, SPREAD: 0.35, OFFBLK: 1.5, KIND: 0.8, POSCHG: 0.5, ALT: 1.5, WKND: 0.8 };

function dayBounds(empId, dn) {
  const ens = entriesOf(empId, dn);
  if (!ens.length) return null;
  let s = Infinity, e = -Infinity;
  for (const x of ens) {
    const sp = shiftSpan(x.start, x.end);
    if (sp.s < s) s = sp.s;
    if (sp.e > e) e = sp.e;
  }
  return { s, e };
}

// Plant eine Kalenderwoche (ws = Montag). opt: { from, to, keepManual, seed, iters, restarts }
function planWeek(ws, opt) {
  opt = opt || {};
  const S = state.settings, idx = getIndex();
  const rnd = mulberry32(opt.seed != null ? opt.seed : (Math.random() * 4294967296) >>> 0);
  const keepManual = opt.keepManual !== false;
  const rangeA = opt.from != null ? opt.from : ws, rangeB = opt.to != null ? opt.to : ws + 6;
  const P = S.positions, nP = P.length;
  const posIndex = new Map(P.map((p, i) => [p.id, i]));
  const shIndex = new Map(S.shifts.map((s, i) => [s.id, i]));
  const shifts = S.shifts.filter(s => netHours(s.start, s.end, s.pause) > 0);
  const minRest = (+S.minRestH || 0) * 60, maxConsec = +S.maxConsec || 7;

  const OFF = { off: true, st: 0, en: 0, hrs: 0, cov: 0, parts: EMPTY, shIdx: -1, pos: -1, isMain: true };
  const makeOpt = (sh, posId, isMain) => {
    const { s, e } = shiftSpan(sh.start, sh.end);
    const cov = covMask(sh.covers), pos = posIndex.get(posId);
    return { off: false, sh, shIdx: shIndex.get(sh.id), pos, st: s, en: e, hrs: (e - s - (+sh.pause || 0)) / 60, cov, isMain, parts: [{ pos, cov }] };
  };
  const fixedOpt = entries => {
    let st = Infinity, en = -Infinity, hrs = 0, cov = 0;
    const parts = [];
    for (const x of entries) {
      const sp = shiftSpan(x.start, x.end), c = covMask(x.cov);
      st = Math.min(st, sp.s); en = Math.max(en, sp.e); hrs += (sp.e - sp.s - (+x.pause || 0)) / 60; cov |= c;
      parts.push({ pos: posIndex.has(x.pos) ? posIndex.get(x.pos) : -1, cov: c });
    }
    return { off: false, fixed: true, st, en, hrs, cov, parts, shIdx: -2, pos: parts[0].pos, isMain: true };
  };

  /* ---- Tage ---- */
  const days = [];
  for (let k = 0; k < 7; k++) {
    const dn = ws + k, st = dayStatus(dn);
    const req = P.map(p => { const r = (S.req[p.id] || [])[k] || [0, 0]; return st.open ? [r[0] | 0, r[1] | 0] : [0, 0]; });
    let tot = 0;
    req.forEach(r => { tot += r[0] + r[1]; });
    days.push({ dn, k, st, open: st.open && dn >= rangeA && dn <= rangeB, req, tot });
  }
  const openDays = days.filter(d => d.st.open);
  const avgTot = openDays.length ? openDays.reduce((s, d) => s + d.tot, 0) / openDays.length : 1;
  days.forEach(d => { d.w = Math.max(0.5, d.tot / Math.max(1, avgTot)); });

  /* ---- Personen ---- */
  const emps = state.employees.filter(e => {
    if (e.active === false || !e.main || !posIndex.has(e.main)) return false;
    const f = e.from ? toDn(e.from) : -1e9, t = e.to ? toDn(e.to) : 1e9;
    return f <= ws + 6 && t >= ws;
  });
  const empIds = new Set(emps.map(e => e.id));
  const nE = emps.length;
  let prevPlanned = false;
  for (let dn = ws - 7; dn < ws; dn++) if (dayEntries(dn).length) prevPlanned = true;

  const E = emps.map(e => {
    const eFrom = e.from ? toDn(e.from) : -1e9, eTo = e.to ? toDn(e.to) : 1e9;
    const C = Math.max(1, +e.days || 5), weekly = +e.weekly || 0, dayH = weekly / C;
    const off = e.offDays || EMPTY;
    const absMap = idx.abs.get(e.id);
    const win = empWindow(e);
    const avail = [], forced = [], tracked = [];
    let empDays = 0, candCredit = 0, candZa = 0;
    for (let k = 0; k < 7; k++) {
      const dn = ws + k, d = days[k];
      const employed = dn >= eFrom && dn <= eTo;
      const absType = absMap ? absMap.get(dn) || null : null;
      const isTracked = employed && dn >= win.a && dn <= win.b; // zählt für Soll
      tracked.push(isTracked);
      if (isTracked) empDays++;
      const regular = isTracked && S.openDays[k] && off.indexOf(k) < 0;
      if (regular && absType !== 'frei') {
        const kind = offDayKind(d.st, absType);
        if (kind === 'hol') candCredit++;
        else if (kind === 'abs') { if (absType === 'za') candZa++; else candCredit++; }
      }
      avail.push(d.st.open && employed && !absType && off.indexOf(k) < 0);
      forced.push(!avail[k]);
    }
    // Über-/Unterstunden der letzten 4 Wochen werden zur Hälfte in dieser Woche ausgeglichen
    // (nur wenn davor überhaupt geplant wurde, sonst würden Lücken im Plan als Minusstunden gelten)
    let carry = 0;
    if (prevPlanned && ws - 1 >= win.a) carry = clamp(empTotals(e, Math.max(win.a, ws - 28), ws - 1).saldo, -6, 6) * 0.5;
    const T = Math.max(0, weekly * empDays / 7 - dayH * candZa - carry);
    // Auswahl an möglichen Diensten
    const posList = [e.main].concat((e.alt || []).filter(x => x !== e.main)).filter(id => posIndex.has(id));
    const allowed = e.allowed && e.allowed.length ? shifts.filter(s => e.allowed.indexOf(s.id) >= 0) : shifts;
    const opts = [], optBy = new Map();
    for (const sh of allowed) for (const pid of posList) {
      const o = makeOpt(sh, pid, pid === e.main);
      opts.push(o);
      optBy.set(o.shIdx * 64 + o.pos, o);
    }
    // Umfeld: Tage vor und nach der Woche
    let run = 0;
    for (let dn = ws - 1; dn >= ws - 14 && entriesOf(e.id, dn).length; dn--) run++;
    const pb = dayBounds(e.id, ws - 1), nb = dayBounds(e.id, ws + 7);
    let wkPrior = 0;
    for (let dn = ws - 28; dn < ws; dn++) if (wdOf(dn) >= 5) wkPrior += entriesOf(e.id, dn).length ? 1 : 0;
    return { emp: e, C, dayH, T, target: T, tracked, candCredit, avail, forced, opts, optBy, run, prevEnd: pb ? pb.e : null, nextStart: nb ? nb.s : null, wkPrior, wkDelta: 0 };
  });
  if (S.fairWeekends !== false && nE) {
    const mean = E.reduce((s, e) => s + e.wkPrior, 0) / nE;
    E.forEach(e => { e.wkDelta = e.wkPrior - mean; });
  }

  /* ---- feste Zellen (außerhalb des Zeitraums / manuell) und Hintergrund ---- */
  const fixed = E.map(() => new Array(7).fill(null));
  E.forEach((e, ei) => {
    for (let k = 0; k < 7; k++) {
      const dn = ws + k, existing = entriesOf(e.emp.id, dn);
      const inRange = dn >= rangeA && dn <= rangeB;
      const keep = !inRange ? existing : keepManual ? existing.filter(x => x.manual) : EMPTY;
      if (keep.length) fixed[ei][k] = fixedOpt(keep);
      else if (!inRange) fixed[ei][k] = OFF;
    }
  });
  // Angebrochene Wochen (z. B. am Monatsende): bereits Eingetragenes zählt mit, der Rest wird nach Kalendertagen
  // (wie das Soll) auf die jetzt und die später noch zu planenden Tage verteilt
  E.forEach((e, ei) => {
    let hOut = 0, hFixIn = 0, calIn = 0, calAfter = 0;
    for (let k = 0; k < 7; k++) {
      const dn = ws + k, inRange = dn >= rangeA && dn <= rangeB, f = fixed[ei][k], has = !!(f && !f.off);
      if (has) { if (inRange) hFixIn += f.hrs; else hOut += f.hrs; }
      if (!e.tracked[k]) continue;
      if (inRange) calIn++;
      else if (dn > rangeB && !has && e.avail[k]) calAfter++;
    }
    const R = Math.max(0, e.T - hOut - hFixIn);
    e.target = Math.max(0, e.T - (calIn + calAfter > 0 ? R * calAfter / (calIn + calAfter) : 0));
  });
  const bgCnt = days.map(() => new Int32Array(nP * 2)), bgHead = days.map(() => 0);
  days.forEach(d => {
    const seen = new Set();
    for (const x of dayEntries(d.dn)) {
      if (empIds.has(x.emp)) continue;
      seen.add(x.emp);
      const c = covMask(x.cov), p = posIndex.get(x.pos);
      if (p === undefined) continue;
      if (c & 1) bgCnt[d.k][p * 2]++;
      if (c & 2) bgCnt[d.k][p * 2 + 1]++;
    }
    bgHead[d.k] = seen.size;
  });

  /* ---- freie Zellen ---- */
  const freeCells = [], freeDaysOf = E.map(() => []), freeEmpsOfDay = days.map(() => []);
  E.forEach((e, ei) => {
    if (!e.opts.length) return;
    for (let k = 0; k < 7; k++) {
      if (fixed[ei][k] || e.forced[k]) continue;
      freeCells.push(ei * 7 + k); freeDaysOf[ei].push(k); freeEmpsOfDay[k].push(ei);
    }
  });

  const cur = E.map((e, ei) => fixed[ei].map(f => f || OFF));
  const cnt = new Int32Array(nP * 2);
  const wkStress = S.fairWeekends !== false;

  function dayCost(k) {
    const d = days[k];
    if (!d.open) return 0;
    cnt.fill(0);
    let head = bgHead[k];
    for (let i = 0; i < nE; i++) {
      const o = cur[i][k];
      if (o.off) continue;
      head++;
      const parts = o.parts;
      for (let q = 0; q < parts.length; q++) {
        const pt = parts[q];
        if (pt.pos < 0) continue;
        if (pt.cov & 1) cnt[pt.pos * 2]++;
        if (pt.cov & 2) cnt[pt.pos * 2 + 1]++;
      }
    }
    let c = 0;
    const bg = bgCnt[k];
    for (let p = 0; p < nP; p++) for (let s = 0; s < 2; s++) {
      const have = cnt[p * 2 + s] + bg[p * 2 + s], need = d.req[p][s];
      if (have < need) c += PW.MISS * (need - have);
    }
    if (head < S.minPersons) c += PW.MINP * (S.minPersons - head);
    const hw = head / d.w;
    return c + PW.SPREAD * hw * hw;
  }

  function rowCost(ei) {
    const e = E[ei], row = cur[ei];
    let hrs = 0, W = 0, cost = 0, run = e.run, prev = null, prevEnd = e.prevEnd, blocks = 0, wasOff = false;
    for (let k = 0; k < 7; k++) {
      const o = row[k];
      if (o.off) {
        if (!wasOff) blocks++;
        wasOff = true; run = 0; prev = null; prevEnd = null;
        continue;
      }
      wasOff = false;
      W++; hrs += o.hrs;
      if (prevEnd !== null && 1440 + o.st - prevEnd < minRest) cost += PW.REST;
      run++;
      if (run > maxConsec) cost += PW.CONSEC;
      if (prev) {
        if (prev.shIdx !== o.shIdx) cost += PW.KIND;
        if (prev.pos !== o.pos) cost += PW.POSCHG;
      }
      if (!o.isMain) cost += PW.ALT;
      if (wkStress && k >= 5) cost += PW.WKND * e.wkDelta;
      prev = o; prevEnd = o.en;
    }
    if (prevEnd !== null && e.nextStart !== null && 1440 + e.nextStart - prevEnd < minRest) cost += PW.REST;
    const credited = Math.min(e.candCredit, Math.max(0, e.C - W));
    const dev = hrs + credited * e.dayH - e.target;
    cost += dev > 0 ? PW.OVER * dev : -PW.UNDER * dev;
    cost += PW.LOST * (e.candCredit - credited);
    if (W > e.C) cost += PW.DAYS * (W - e.C);
    if (blocks > 1) cost += PW.OFFBLK * (blocks - 1);
    return cost;
  }

  const rowC = new Array(nE), dayC = new Array(7);
  const cellCost = () => {
    let t = 0;
    for (let i = 0; i < nE; i++) t += (rowC[i] = rowCost(i));
    for (let k = 0; k < 7; k++) t += (dayC[k] = dayCost(k));
    return t;
  };

  let bestSol = null, bestTot = Infinity;
  if (freeCells.length) {
    const iters = opt.iters || Math.max(30000, freeCells.length * 1000);
    const restarts = opt.restarts || 3;
    const T0 = 25, T1 = 0.12, cool = Math.pow(T1 / T0, 1 / iters);
    for (let rs = 0; rs < restarts; rs++) {
      for (let i = 0; i < nE; i++) for (let k = 0; k < 7; k++) cur[i][k] = fixed[i][k] || OFF;
      let total = cellCost(), T = T0;
      for (let it = 0; it < iters; it++, T *= cool) {
        const r = rnd();
        if (r < 0.55) {
          // Zelle ändern
          const c = freeCells[(rnd() * freeCells.length) | 0], ei = (c / 7) | 0, k = c % 7;
          const e = E[ei], old = cur[ei][k];
          const nw = rnd() < 0.3 ? OFF : e.opts[(rnd() * e.opts.length) | 0];
          if (nw === old) continue;
          const oR = rowC[ei], oD = dayC[k];
          cur[ei][k] = nw;
          const nR = rowCost(ei), nD = dayCost(k), delta = nR + nD - oR - oD;
          if (delta <= 0 || rnd() < Math.exp(-delta / T)) { rowC[ei] = nR; dayC[k] = nD; total += delta; }
          else cur[ei][k] = old;
        } else if (r < 0.8) {
          // zwei Tage einer Person tauschen
          const c = freeCells[(rnd() * freeCells.length) | 0], ei = (c / 7) | 0, k1 = c % 7;
          const fd = freeDaysOf[ei], k2 = fd[(rnd() * fd.length) | 0];
          if (k1 === k2 || cur[ei][k1] === cur[ei][k2]) continue;
          const a = cur[ei][k1], b = cur[ei][k2];
          const oR = rowC[ei], oD1 = dayC[k1], oD2 = dayC[k2];
          cur[ei][k1] = b; cur[ei][k2] = a;
          const nR = rowCost(ei), nD1 = dayCost(k1), nD2 = dayCost(k2), delta = nR + nD1 + nD2 - oR - oD1 - oD2;
          if (delta <= 0 || rnd() < Math.exp(-delta / T)) { rowC[ei] = nR; dayC[k1] = nD1; dayC[k2] = nD2; total += delta; }
          else { cur[ei][k1] = a; cur[ei][k2] = b; }
        } else {
          // Dienste zweier Personen an einem Tag tauschen
          const c = freeCells[(rnd() * freeCells.length) | 0], e1 = (c / 7) | 0, k = c % 7;
          const fe = freeEmpsOfDay[k], e2 = fe[(rnd() * fe.length) | 0];
          if (e1 === e2) continue;
          const a = cur[e1][k], b = cur[e2][k];
          if (a === b) continue;
          const na = b.off ? OFF : E[e1].optBy.get(b.shIdx * 64 + b.pos);
          const nb = a.off ? OFF : E[e2].optBy.get(a.shIdx * 64 + a.pos);
          if (!na || !nb) continue;
          const o1 = rowC[e1], o2 = rowC[e2], oD = dayC[k];
          cur[e1][k] = na; cur[e2][k] = nb;
          const n1 = rowCost(e1), n2 = rowCost(e2), nD = dayCost(k), delta = n1 + n2 + nD - o1 - o2 - oD;
          if (delta <= 0 || rnd() < Math.exp(-delta / T)) { rowC[e1] = n1; rowC[e2] = n2; dayC[k] = nD; total += delta; }
          else { cur[e1][k] = a; cur[e2][k] = b; }
        }
      }
      // Feinschliff: Einzelverbesserungen, bis nichts mehr besser wird
      for (let pass = 0, improved = true; improved && pass < 6; pass++) {
        improved = false;
        for (const c of freeCells) {
          const ei = (c / 7) | 0, k = c % 7, e = E[ei], old = cur[ei][k];
          let bestO = old, bestD = 0;
          const oR = rowC[ei], oD = dayC[k];
          let bR = oR, bD = oD;
          for (let j = -1; j < e.opts.length; j++) {
            const o = j < 0 ? OFF : e.opts[j];
            if (o === old) continue;
            cur[ei][k] = o;
            const nR = rowCost(ei), nD = dayCost(k), delta = nR + nD - oR - oD;
            if (delta < bestD - 1e-9) { bestD = delta; bestO = o; bR = nR; bD = nD; }
          }
          cur[ei][k] = bestO;
          if (bestO !== old) { rowC[ei] = bR; dayC[k] = bD; total += bestD; improved = true; }
        }
      }
      if (total < bestTot - 1e-9) { bestTot = total; bestSol = cur.map(row => row.slice()); }
    }
  }

  /* ---- Ergebnis übernehmen ---- */
  for (let k = 0; k < 7; k++) {
    const dn = ws + k;
    if (dn < rangeA || dn > rangeB) continue;
    const iso = fromDn(dn);
    let arr = (state.plan[iso] || []).filter(en => !(empIds.has(en.emp) && !(keepManual && en.manual)));
    if (bestSol) {
      E.forEach((e, ei) => {
        const o = bestSol[ei][k];
        if (o.off || o.fixed) return;
        arr.push({ id: uid('n'), emp: e.emp.id, pos: P[o.pos].id, shift: o.sh.id, start: o.sh.start, end: o.sh.end, pause: +o.sh.pause || 0, cov: o.sh.covers, manual: false });
      });
    }
    if (arr.length) state.plan[iso] = arr; else delete state.plan[iso];
  }
  touch();
  return { cost: bestTot, employees: nE };
}

// Alle Wochen (Montage), die den Zeitraum a..b berühren
function weeksOf(a, b) {
  const out = [];
  for (let ws = mondayOf(a); ws <= b; ws += 7) out.push(ws);
  return out;
}

/* ===== Prüfung einer Woche (auch für manuell bearbeitete Pläne) ===== */

function checkWeek(ws) {
  const S = state.settings, out = [];
  const minRest = (+S.minRestH || 0) * 60, maxConsec = +S.maxConsec || 7;
  for (let k = 0; k < 7; k++) {
    const dn = ws + k, st = dayStatus(dn);
    if (!st.open) continue;
    const ens = dayEntries(dn);
    for (const p of S.positions) {
      const req = (S.req[p.id] || [])[k] || [0, 0];
      for (let s = 0; s < 2; s++) {
        const have = ens.filter(en => en.pos === p.id && (covMask(en.cov) & (1 << s))).length;
        if (have < req[s]) out.push({ type: 'cover', dn, pos: p.id, slot: s ? 'S' : 'F', need: req[s], have });
      }
    }
    const heads = new Set(ens.map(en => en.emp)).size;
    if (heads < S.minPersons) out.push({ type: 'minp', dn, have: heads, need: S.minPersons });
  }
  for (const e of state.employees) {
    let any = false;
    for (let k = -1; k < 7; k++) if (entriesOf(e.id, ws + k).length) any = true;
    if (!any && e.active === false) continue;
    // Ruhezeit und Arbeitstage in Folge
    let run = 0;
    for (let dn = ws - 14; dn <= ws + 6; dn++) if (dn >= ws - 14) {
      const b = dayBounds(e.id, dn);
      if (!b) { run = 0; continue; }
      run++;
      if (dn >= ws && run > maxConsec) out.push({ type: 'consec', emp: e.id, dn, run });
      const pb = dayBounds(e.id, dn - 1);
      if (dn >= ws && pb && 1440 + b.s - pb.e < minRest) out.push({ type: 'rest', emp: e.id, dn, rest: (1440 + b.s - pb.e) / 60 });
    }
    // Einträge an Abwesenheitstagen
    for (let k = 0; k < 7; k++) {
      const a = absenceOf(e.id, ws + k);
      if (a && (a === 'urlaub' || a === 'krank') && entriesOf(e.id, ws + k).length) out.push({ type: 'conflict', emp: e.id, dn: ws + k, abs: a });
    }
    // Wochenstunden
    if (e.active !== false && +e.weekly > 0) {
      const t = empTotals(e, ws, ws + 6);
      if (t.soll > 0 && Math.abs(t.saldo) >= 2) out.push({ type: 'hours', emp: e.id, saldo: t.saldo, ist: t.ist, soll: t.soll });
    }
  }
  return out;
}

function describeIssue(x) {
  const emp = x.emp ? (getEmp(x.emp) || {}).name : '';
  const day = x.dn != null ? WD_SHORT[wdOf(x.dn)] + ' ' + fmtDM(x.dn) : '';
  switch (x.type) {
    case 'cover': { const p = getPos(x.pos); return day + ': ' + (p ? p.name : '?') + ' ' + (x.slot === 'F' ? 'früh' : 'spät') + ' nicht ausreichend besetzt (' + x.have + ' von ' + x.need + ')'; }
    case 'minp': return day + ': nur ' + x.have + ' Person' + (x.have === 1 ? '' : 'en') + ' eingeteilt (mindestens ' + x.need + ')';
    case 'rest': return day + ': ' + emp + ' hat nur ' + fmtNum(x.rest, 1) + ' Std. Ruhezeit vor dem Dienst';
    case 'consec': return day + ': ' + emp + ' arbeitet den ' + x.run + '. Tag in Folge';
    case 'conflict': return day + ': ' + emp + ' ist eingeteilt, hat aber ' + (x.abs === 'krank' ? 'Krankenstand' : 'Urlaub');
    case 'hours': return emp + ': Woche ' + fmtSigned(x.saldo) + ' Std. (Ist ' + fmtH(x.ist) + ' / Soll ' + fmtH(x.soll) + ')';
  }
  return '';
}

/* ===== Speichern, Rückgängig, Sicherung =====
 * Arbeitskopie: localStorage des Browsers (schneller Start, geht in jedem Browser).
 * Zusätzlich (Chrome/Edge): ein Datenordner auf dem Computer. Dort liegt die Datei "Dienstplan-Daten.json" und im
 * Unterordner "Sicherungen" je Arbeitstag eine Kopie (die letzten 30). Der Ordner ist die maßgebliche Fassung:
 * beim Start werden neuere Daten aus dem Ordner übernommen. Jeder Stand trägt einen Zeitstempel (savedAt).
 * Abweichungen werden erkannt und nie stillschweigend überschrieben; die jeweils ersetzte Fassung wird aufgehoben.
 */

const STORE_KEY = 'dienstplan.daten.v1';
const META_KEY = 'dienstplan.meta.v1';
const DATA_FILE = 'Dienstplan-Daten.json';
const BACKUP_DIR = 'Sicherungen';
const KEEP_BACKUPS = 30;
let meta = { lastBackup: 0, fsLastWritten: 0 };
const undoStack = [];
let saveTimer = null;
let saveState = 'saved'; // saved | saving | error
const fsApi = {
  supported: typeof window !== 'undefined' && typeof window.showDirectoryPicker === 'function',
  dir: null, name: '', ok: false, error: '', conflict: null,
  lastSavedAt: 0, lastBackupDay: '', busy: false, again: false,
};

function loadMeta() {
  try { meta = Object.assign(meta, JSON.parse(localStorage.getItem(META_KEY) || '{}')); } catch (e) { /* egal */ }
}
function saveMeta() {
  try { localStorage.setItem(META_KEY, JSON.stringify(meta)); } catch (e) { /* egal */ }
}
function loadFromStorage() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) return migrate(JSON.parse(raw));
  } catch (e) { console.warn('Laden fehlgeschlagen', e); }
  return null;
}

function pushUndo() {
  undoStack.push(JSON.stringify(state));
  if (undoStack.length > 25) undoStack.shift();
}
// Änderung am Datenbestand: Rückgängig-Punkt setzen, ausführen, speichern, neu zeichnen
function mutate(fn) {
  pushUndo();
  const r = fn();
  afterChange();
  return r;
}
function afterChange() {
  touch();
  scheduleSave();
  render();
}
function undo() {
  const snap = undoStack.pop();
  if (!snap) { toast('Nichts zum Rückgängigmachen'); return; }
  state = migrate(JSON.parse(snap));
  afterChange();
  toast('Rückgängig gemacht');
}

/* ---------- Speichern (Browser und Datenordner) ---------- */

function scheduleSave() {
  saveState = 'saving';
  updateFooter();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveNow, 350);
}
function saveLocalRaw() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(state));
    saveState = 'saved';
  } catch (e) {
    saveState = 'error';
    console.error(e);
  }
  updateFooter();
}
function saveNow() {
  clearTimeout(saveTimer);
  saveTimer = null;
  state.savedAt = Math.max(Date.now(), (state.savedAt || 0) + 1, (fsApi.lastSavedAt || 0) + 1);
  saveLocalRaw();
  fsWrite();
}
window.addEventListener('beforeunload', () => { if (saveTimer) saveNow(); });

/* ---------- Sicherung als Datei (geht in jedem Browser) ---------- */

function downloadBackup() {
  const blob = new Blob([JSON.stringify(state, null, 1)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'Dienstplan-Sicherung-' + fromDn(todayDn()) + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  meta.lastBackup = Date.now();
  saveMeta();
  updateFooter();
  toast('Sicherung heruntergeladen. Bitte an einem sicheren Ort aufbewahren.');
}
function restoreFromText(text) {
  let s;
  try { s = migrate(JSON.parse(text)); } catch (e) { toast('Diese Datei ist keine gültige Dienstplan-Sicherung.', 'bad'); return; }
  confirmBox('Alle aktuellen Daten werden durch die Sicherung ersetzt (' + s.employees.length + ' Mitarbeiter). Fortfahren?', 'Sicherung laden', () => {
    fsSafetyCopy('vor-Sicherung-laden');
    pushUndo();
    state = s;
    afterChange();
    toast('Sicherung geladen');
  }, true);
}

/* ---------- Datenordner (Chrome / Edge) ---------- */

function idbOpen() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('dienstplan-fs', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function idbGet(k) {
  const db = await idbOpen();
  return new Promise((res, rej) => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
}
async function idbSet(k, v) {
  const db = await idbOpen();
  return new Promise((res, rej) => { const q = db.transaction('kv', 'readwrite').objectStore('kv').put(v, k); q.onsuccess = () => res(); q.onerror = () => rej(q.error); });
}

const dayStamp = t => { const d = new Date(t); return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()); };
const timeStamp = t => { const d = new Date(t); return dayStamp(t) + '-' + p2(d.getHours()) + p2(d.getMinutes()); };
const fmtStand = t => (t ? new Date(t).toLocaleString('de-AT', { dateStyle: 'short', timeStyle: 'short' }) : 'unbekannt');
const summaryOf = s => s.employees.length + ' Mitarbeiter, ' + Object.keys(s.plan).reduce((n, k) => n + s.plan[k].length, 0) + ' Dienste';

async function fsGetText(dir, name) { // null, wenn die Datei nicht existiert
  try { return await (await (await dir.getFileHandle(name)).getFile()).text(); }
  catch (e) { if (e && e.name === 'NotFoundError') return null; throw e; }
}
async function fsPutText(dir, name, text) { // schreibt über eine Zwischendatei, ein Abbruch beschädigt nichts
  const w = await (await dir.getFileHandle(name, { create: true })).createWritable();
  await w.write(text);
  await w.close();
}
// Stand aus dem Ordner: null = noch keine Datei; wirft bei beschädigter Datei
async function fsReadState() {
  const text = await fsGetText(fsApi.dir, DATA_FILE);
  if (text == null || !text.trim()) return null;
  return migrate(JSON.parse(text));
}
// Kopie im Unterordner "Sicherungen" ablegen, vorhandene Dateien werden nie überschrieben
async function fsKeepCopy(name, text) {
  const bd = await fsApi.dir.getDirectoryHandle(BACKUP_DIR, { create: true });
  if ((await fsGetText(bd, name)) != null) return;
  await fsPutText(bd, name, text);
}
// Aktuellen Stand vor dem Ersetzen im Ordner aufheben
function fsSafetyCopy(label) {
  if (!fsApi.dir || !fsApi.ok) return Promise.resolve();
  const text = JSON.stringify(state, null, 1);
  return fsKeepCopy('Dienstplan-' + label + '-' + timeStamp(Date.now()) + '.json', text).catch(() => { /* nicht kritisch */ });
}
async function fsPruneBackups() {
  try {
    const bd = await fsApi.dir.getDirectoryHandle(BACKUP_DIR, { create: true }), names = [];
    for await (const e of bd.values()) if (e.kind === 'file' && /^Dienstplan-Sicherung-\d{4}-\d{2}-\d{2}\.json$/.test(e.name)) names.push(e.name);
    names.sort();
    for (const n of names.slice(0, Math.max(0, names.length - KEEP_BACKUPS))) await bd.removeEntry(n);
  } catch (e) { /* Aufräumen ist nicht kritisch */ }
}
// Beim ersten Schreiben eines Tages den letzten Stand des früheren Arbeitstages als Tagessicherung aufheben
async function fsDailyBackup() {
  const today = dayStamp(Date.now());
  if (fsApi.lastBackupDay === today) return;
  const text = await fsGetText(fsApi.dir, DATA_FILE);
  if (text) {
    let at = 0;
    try { at = JSON.parse(text).savedAt || 0; } catch (e) { at = 0; }
    if (at && dayStamp(at) < today) await fsKeepCopy('Dienstplan-Sicherung-' + dayStamp(at) + '.json', text);
  }
  await fsPruneBackups();
  fsApi.lastBackupDay = today;
}

async function fsWrite() {
  if (!fsApi.dir || !fsApi.ok || fsApi.conflict) return;
  if (fsApi.busy) { fsApi.again = true; return; } // läuft schon: danach noch einmal mit dem neuesten Stand
  fsApi.busy = true;
  try {
    let cur = null;
    try { cur = await fsReadState(); } catch (e) { throw new Error('Die Datei im Datenordner ist beschädigt und wurde nicht überschrieben.'); }
    // hat jemand anderes (anderer Computer / Browser) die Datei inzwischen geändert?
    if (cur && (cur.savedAt || 0) > fsApi.lastSavedAt) { fsApi.conflict = { file: cur }; fsConflictPrompt(); return; }
    await fsDailyBackup();
    const at = state.savedAt;
    await fsPutText(fsApi.dir, DATA_FILE, JSON.stringify(state, null, 1));
    fsApi.lastSavedAt = at;
    meta.fsLastWritten = at;
    meta.lastBackup = Date.now();
    saveMeta();
    fsApi.error = '';
  } catch (e) {
    console.error(e);
    fsApi.ok = false;
    fsApi.error = e.message || String(e);
    toast('Im Datenordner konnte nicht gespeichert werden: ' + fsApi.error, 'bad');
  } finally {
    fsApi.busy = false;
  }
  updateFooter();
  if (fsApi.again && fsApi.ok && !fsApi.conflict) { fsApi.again = false; fsWrite(); }
}

// Stand des Ordners übernehmen (ohne Rückfrage; nur aufrufen, wenn das eindeutig richtig ist)
function fsAdoptSilently(file, msg) {
  pushUndo();
  state = file;
  fsApi.lastSavedAt = file.savedAt || 0;
  meta.fsLastWritten = fsApi.lastSavedAt;
  saveMeta();
  touch();
  saveLocalRaw();
  render();
  if (msg) toast(msg);
}
// Abgleich beim Start / nach dem Wiederverbinden / auf Wunsch
async function fsSync(manual) {
  let file;
  try { file = await fsReadState(); }
  catch (e) { fsApi.ok = false; fsApi.error = 'Die Datei im Datenordner ist beschädigt.'; toast(fsApi.error + ' Es wurde nichts überschrieben. Die Tagessicherungen liegen im Unterordner „' + BACKUP_DIR + '“.', 'bad'); updateFooter(); return; }
  if (!file) { saveNow(); return; } // Ordner ohne Datei: aktuellen Stand hineinschreiben
  const fAt = file.savedAt || 0, lAt = state.savedAt || 0;
  if (fAt === lAt) { fsApi.lastSavedAt = fAt; if (manual) toast('Bereits auf dem neuesten Stand.'); updateFooter(); return; }
  if (fAt > lAt) { fsAdoptSilently(file, 'Neuere Daten aus dem Datenordner geladen (Stand ' + fmtStand(fAt) + ').'); return; }
  if (fAt === (meta.fsLastWritten || 0)) { fsApi.lastSavedAt = fAt; await fsWrite(); return; } // nur eigene, noch nicht geschriebene Änderungen
  fsApi.conflict = { file };
  fsConflictPrompt();
}
async function fsInit() {
  if (!fsApi.supported) return;
  try {
    const dir = await idbGet('dir');
    if (!dir) return;
    fsApi.dir = dir; fsApi.name = dir.name; fsApi.lastSavedAt = meta.fsLastWritten || 0;
    const perm = typeof dir.queryPermission === 'function' ? await dir.queryPermission({ mode: 'readwrite' }) : 'granted';
    if (perm === 'granted') { fsApi.ok = true; updateFooter(); await fsSync(false); } else updateFooter();
  } catch (e) { console.warn('Datenordner nicht nutzbar', e); }
}
async function fsReconnect() {
  try {
    const perm = typeof fsApi.dir.requestPermission === 'function' ? await fsApi.dir.requestPermission({ mode: 'readwrite' }) : 'granted';
    if (perm !== 'granted') { toast('Ohne Erlaubnis kann nicht im Datenordner gespeichert werden.', 'bad'); return; }
    fsApi.ok = true; fsApi.error = '';
    await fsSync(false);
    render();
    if (fsApi.ok && !fsApi.conflict) toast('Datenordner wieder verbunden');
  } catch (e) { toast('Verbinden nicht möglich: ' + e.message, 'bad'); }
}
async function fsConnect() {
  let dir;
  try { dir = await window.showDirectoryPicker({ id: 'dienstplan-daten', mode: 'readwrite', startIn: 'documents' }); }
  catch (e) { if (!e || e.name !== 'AbortError') toast('Der Ordner konnte nicht geöffnet werden: ' + (e && e.message), 'bad'); return; }
  await fsAttach(dir);
}
// Ordner verbinden (Auswahl durch den Benutzer); bereits vorhandene Daten auf beiden Seiten werden nie stillschweigend ersetzt
async function fsAttach(dir) {
  fsApi.dir = dir; fsApi.name = dir.name; fsApi.ok = true; fsApi.error = ''; fsApi.conflict = null;
  fsApi.lastSavedAt = 0; fsApi.lastBackupDay = ''; meta.fsLastWritten = 0; saveMeta();
  try { await idbSet('dir', dir); } catch (e) { /* Verbindung gilt dann nur bis zum Schließen */ }
  let file;
  try { file = await fsReadState(); }
  catch (e) { fsApi.dir = null; fsApi.ok = false; toast('In diesem Ordner liegt eine beschädigte oder fremde Datei „' + DATA_FILE + '“. Bitte einen anderen Ordner wählen.', 'bad'); render(); return; }
  const localHas = state.employees.length > 0 || Object.keys(state.plan).length > 0;
  if (!file) { saveNow(); render(); toast('Datenordner „' + dir.name + '“ verbunden. Die bisherigen Daten wurden hineingeschrieben.'); return; }
  if (!localHas || (file.savedAt || 0) === (state.savedAt || 0)) { fsAdoptSilently(file, 'Datenordner „' + dir.name + '“ verbunden. Daten geladen (Stand ' + fmtStand(file.savedAt) + ').'); return; }
  fsApi.conflict = { file };
  render();
  fsConflictPrompt();
}
async function fsDisconnect() {
  fsApi.dir = null; fsApi.ok = false; fsApi.name = ''; fsApi.conflict = null; fsApi.error = '';
  meta.fsLastWritten = 0; saveMeta();
  try { await idbSet('dir', null); } catch (e) { /* egal */ }
  render();
}

/* ---------- Abweichende Daten im Ordner ---------- */

function fsConflictPrompt() {
  const c = fsApi.conflict;
  if (!c) return;
  const f = c.file, folderNewer = (f.savedAt || 0) > (state.savedAt || 0);
  updateFooter();
  const adopt = { label: 'Daten aus dem Ordner laden', act: 'fs-adopt' };
  const over = { label: 'Meine Daten in den Ordner schreiben', act: 'fs-overwrite' };
  const main = folderNewer ? adopt : over, other = folderNewer ? over : adopt;
  openModal({
    title: 'Datenordner: abweichende Daten', submitLabel: main.label, noFocus: true,
    body: '<p class="confirm-text">Die Daten im Datenordner sind nicht dieselben wie in diesem Browser. Das passiert, wenn zwischendurch auf einem anderen Computer oder in einem anderen Browser gearbeitet wurde.</p>' +
      '<table class="list cfg"><thead><tr><th></th><th>Stand</th><th>Inhalt</th></tr></thead><tbody>' +
