      '<p class="muted">Die jeweils ersetzte Fassung wird im Unterordner „' + BACKUP_DIR + '“ aufgehoben, es geht nichts verloren. Solange nichts entschieden ist, wird im Datenordner nichts geändert.</p>',

}
async function fsAdoptFolder() {
  const c = fsApi.conflict;
  if (!c) return;
  await fsSafetyCopy('Browserstand');
  fsApi.conflict = null;
  fsAdoptSilently(c.file, 'Daten aus dem Datenordner geladen (Stand ' + fmtStand(c.file.savedAt) + ').');
}
async function fsOverwriteFolder() {
  const c = fsApi.conflict;
  if (!c) return;
  try {
    const old = await fsGetText(fsApi.dir, DATA_FILE);
    if (old) await fsKeepCopy('Dienstplan-Ordnerstand-' + timeStamp(Date.now()) + '.json', old);
  } catch (e) { /* nicht kritisch */ }
  fsApi.lastSavedAt = c.file.savedAt || 0;
  fsApi.conflict = null;
  saveNow();
  toast('Deine Daten wurden in den Datenordner geschrieben.');
}

// Text für die Fußzeile
function backupStatus() {
  if (fsApi.dir) {
    if (fsApi.conflict) return { level: 'warn', text: 'Der Datenordner enthält abweichende Daten', action: 'fs-resolve', label: 'Klären' };
    if (!fsApi.ok) return { level: 'warn', text: 'Datenordner „' + fsApi.name + '“ ist nicht verbunden. Änderungen werden vorerst nur im Browser gespeichert.', action: 'fs-reconnect', label: 'Wieder verbinden' };
    return { level: 'ok', text: 'Gespeichert im Datenordner „' + fsApi.name + '“ (mit täglichen Sicherungen)' };
  }
  if (fsApi.supported) return { level: 'warn', text: 'Noch kein Datenordner gewählt. Die Daten liegen nur in diesem Browser.', action: 'fs-connect', label: 'Datenordner wählen' };
  if (!meta.lastBackup) return { level: 'warn', text: 'Noch keine Sicherung. Die Daten liegen nur in diesem Browser.', action: 'backup', label: 'Jetzt sichern' };
  const days = Math.floor((Date.now() - meta.lastBackup) / DAY_MS);
  if (days >= 14) return { level: 'warn', text: 'Letzte Sicherung vor ' + days + ' Tagen', action: 'backup', label: 'Jetzt sichern' };
  return { level: 'ok', text: 'Letzte Sicherung: ' + new Date(meta.lastBackup).toLocaleDateString('de-AT') };
}

function planEmployees(ws) {
  const order = new Map(state.settings.positions.map((p, i) => [p.id, i]));
  const list = state.employees.filter(e => {
    const f = e.from ? toDn(e.from) : -1e9, t = e.to ? toDn(e.to) : 1e9;
    if (e.active !== false && f <= ws + 6 && t >= ws) return true;
    for (let k = 0; k < 7; k++) if (entriesOf(e.id, ws + k).length) return true;
    return false;
  });
  const rank = e => (order.has(e.main) ? order.get(e.main) : 99);
  return list.sort((a, b) => rank(a) - rank(b) || a.name.localeCompare(b.name, 'de'));
}

function chipHtml(en, emp) {
  const p = getPos(en.pos), sh = getShift(en.shift);
  const color = p ? p.color : '#868e96';
  const label = en.shift === 'custom' || !sh ? 'Eigene Zeit' : sh.name;
  const other = p && en.pos !== emp.main ? ' · ' + p.name : '';
  const title = label + ' · ' + (p ? p.name : '?') + ' · ' + fmtH(entHours(en)) + ' Std. (Pause ' + (en.pause || 0) + ' Min.)' + (en.manual ? ' · manuell geändert' : '');
  return '<div class="chip' + (en.manual ? ' man' : '') + '" style="--pc:' + color + ';--pb:' + tint(color, 0.14) + '" title="' + esc(title) + '">' +
    '<div class="t">' + esc(en.start) + '–' + esc(en.end) + '</div><div class="s">' + esc(label + other) + '</div></div>';
}

function cellHtml(emp, dn, st) {
  const ens = entriesOf(emp.id, dn), abs = absenceOf(emp.id, dn);
  let inner = '';
  if (ens.length) inner = ens.slice().sort((a, b) => parseHM(a.start) - parseHM(b.start)).map(en => chipHtml(en, emp)).join('');
  else if (abs) inner = '<div class="absc a-' + abs + '">' + esc(ABS_TYPES[abs] || abs) + '</div>';
  const cls = ['cell'];
  if (!st.open) cls.push('closed');
  if (dn === todayDn()) cls.push('today');
  if (!inner) cls.push('empty');
  return '<td class="' + cls.join(' ') + '" data-act="cell" data-emp="' + emp.id + '" data-dn="' + dn + '">' + inner + '</td>';
}

function coverageHtml(ws) {
  const S = state.settings;
  let rows = '';
  for (const p of S.positions) {
    let tds = '';
    for (let k = 0; k < 7; k++) {
      const dn = ws + k;
      if (!dayStatus(dn).open) { tds += '<td class="cv na">–</td>'; continue; }
      const ens = dayEntries(dn), req = S.req[p.id][k];
      const pill = (slot, lbl) => {
        const have = ens.filter(en => en.pos === p.id && (covMask(en.cov) & (slot ? 2 : 1))).length;
        return '<span class="pill ' + (have >= req[slot] ? 'ok' : 'bad') + '">' + lbl + ' ' + have + '/' + req[slot] + '</span>';
      };
      tds += '<td class="cv">' + pill(0, 'F') + pill(1, 'S') + '</td>';
    }
    rows += '<tr><th><i class="pdot" style="background:' + p.color + '"></i>' + esc(p.name) + '</th>' + tds + '</tr>';
  }
  let tot = '';
  for (let k = 0; k < 7; k++) {
    const dn = ws + k;
    if (!dayStatus(dn).open) { tot += '<td class="cv na">–</td>'; continue; }
    const n = new Set(dayEntries(dn).map(en => en.emp)).size;
    tot += '<td class="cv"><span class="pill ' + (n >= S.minPersons ? 'ok' : 'bad') + '">' + n + ' Pers.</span></td>';
  }
  rows += '<tr class="tot"><th>Personen gesamt <small>(mind. ' + S.minPersons + ')</small></th>' + tot + '</tr>';
  let head = '';
  for (let k = 0; k < 7; k++) head += '<th>' + WD_SHORT[k] + ' ' + fmtDM(ws + k) + '</th>';
  return '<table class="cov"><thead><tr><th>Besetzung <small>F = Früh · S = Spät</small></th>' + head + '</tr></thead><tbody>' + rows + '</tbody></table>';
}

function hintsHtml(ws) {
  const issues = checkWeek(ws);
  const hard = issues.filter(i => i.type !== 'hours'), soft = issues.filter(i => i.type === 'hours');
  let html = '';
  const list = (arr, cls, icon) => {
    const shown = arr.slice(0, 14).map(i => '<li class="' + cls + '"><span>' + icon + '</span>' + esc(describeIssue(i)) + '</li>').join('');
    return shown + (arr.length > 14 ? '<li class="' + cls + '"><span>…</span>und ' + (arr.length - 14) + ' weitere</li>' : '');
  };
  if (hard.length) html += list(hard, 'bad', '⚠');
  if (soft.length) html += list(soft, 'warn', 'ℹ');
  if (!hard.length && !soft.length) {
    const any = Array.from({ length: 7 }, (_, k) => dayEntries(ws + k).length).some(Boolean);
    html = any ? '<li class="ok"><span>✓</span>Alles in Ordnung: Mindestbesetzung erfüllt, Ruhezeiten eingehalten, Wochenstunden passen.</li>'
      : '<li class="warn"><span>ℹ</span>Für diese Woche ist noch nichts geplant. „Automatisch planen“ erstellt den Plan.</li>';
  }
  return '<ul class="hints">' + html + '</ul>';
}

function openCellEditor(empId, dn) {
  const emp = getEmp(empId);
  if (!emp) return;
  const ens = entriesOf(empId, dn).slice().sort((a, b) => parseHM(a.start) - parseHM(b.start));
  const abs = absenceOf(empId, dn), st = dayStatus(dn);
  const mode = ens.length ? 'dienst' : abs || 'leer';
  const radio = (v, label) => '<label class="segbtn"><input type="radio" name="mode" value="' + v + '"' + (mode === v ? ' checked' : '') + '><span>' + label + '</span></label>';
  const body =
    (st.closedReason ? '<p class="note warn">Das Restaurant ist an diesem Tag geschlossen (' + esc(st.closedReason) + ').</p>' : '') +
    '<div class="seg" role="radiogroup" aria-label="Status">' + radio('dienst', 'Dienst') + radio('leer', 'Kein Dienst') + radio('frei', 'Frei (fix)') + radio('urlaub', 'Urlaub') + radio('krank', 'Krank') + radio('za', 'Zeitausgleich') + '</div>' +
    '<div class="mode mode-dienst"><div class="erows">' + (ens.length ? ens.map(en => entryRowHtml(emp, en)).join('') : entryRowHtml(emp, null)) + '</div>' +
    '<button type="button" class="btn sm" data-act="erow-add">+ Weiteren Dienst an diesem Tag</button></div>' +
    '<p class="note mode mode-leer">Für diesen Tag ist kein Dienst eingetragen. Bei der nächsten automatischen Planung kann hier wieder ein Dienst eingeteilt werden.</p>' +
    '<p class="note mode mode-frei">Der Tag wird fest freigehalten. Die automatische Planung teilt hier keinen Dienst ein, es wird kein Urlaub abgezogen.</p>' +
    '<p class="note mode mode-abs">Wird für diesen einen Tag als Abwesenheit eingetragen. Längere Zeiträume: Registerkarte „Abwesenheiten“.</p>';
  openModal({
    title: emp.name + ' · ' + WD_LONG[wdOf(dn)] + ', ' + fmtDate(dn), body, noFocus: true,
    onMount: form => {
      form.dataset.emp = empId;
      const sync = () => {
        const m = form.mode.value;
        $$('.mode', form).forEach(x => { x.hidden = !(x.classList.contains('mode-' + m) || (x.classList.contains('mode-abs') && (m === 'urlaub' || m === 'krank' || m === 'za'))); });
      };
      $$('input[name=mode]', form).forEach(r => r.addEventListener('change', sync));
      sync();
    },
    onSubmit: form => {
      const m = form.mode.value;
      if (m === 'dienst') {
        const rows = [];
        for (const r of $$('.erow', form)) {
          const start = r.querySelector('[name=start]').value, end = r.querySelector('[name=end]').value;
          const pause = Math.max(0, +r.querySelector('[name=pause]').value || 0);
          if (isNaN(parseHM(start)) || isNaN(parseHM(end)) || start === end) { toast('Bitte Beginn und Ende des Dienstes eintragen.', 'bad'); return false; }
          const tpl = getShift(r.querySelector('[name=shift]').value);
          const same = tpl && tpl.start === start && tpl.end === end && (+tpl.pause || 0) === pause;
          rows.push({ pos: r.querySelector('[name=pos]').value, sh: same ? tpl : { id: 'custom', start, end, pause } });
        }
        if (!rows.length) { toast('Bitte mindestens einen Dienst eintragen oder „Kein Dienst“ wählen.', 'bad'); return false; }
        mutate(() => {
          removeEntriesOf(empId, dn, dn);
          setAbsenceDay(empId, dn, null);
          rows.forEach(r => addEntry(dn, makeEntry(empId, r.pos, r.sh, true)));
        });
      } else {
        mutate(() => {
          removeEntriesOf(empId, dn, dn);
          setAbsenceDay(empId, dn, m === 'leer' ? null : m);
        });
      }
    },
  });
}

/* ---------- Automatisch planen ---------- */

function planPreset(p) {
  const t = todayDn(), ws = ui.ws;
  const startOf = base => (t >= base && t <= base + 6 ? t : base);
  if (p === 'week') return [startOf(ws), ws + 6];
  if (p === 'weeks4') return [startOf(ws), ws + 27];
  const c = ymd(ws + 3), ms = monthStart(c.y, c.m), me = monthEnd(c.y, c.m);
  return [t >= ms && t <= me ? t : ms, me];
}
ACTIONS['plan-open'] = () => {
  const [from, to] = planPreset('week');
  openModal({
    title: 'Automatisch planen', submitLabel: 'Plan erstellen', noFocus: true,
    body: '<p class="lead">Der Plan wird aus Mindestbesetzung je Position, Wochenstunden, Urlaub, freien Tagen und Ruhezeiten erstellt. Danach lassen sich einzelne Dienste per Klick ändern.</p>' +
      '<div class="row2"><label>Von<input type="date" name="from" value="' + fromDn(from) + '" data-chg="plan-range"></label><label>Bis<input type="date" name="to" value="' + fromDn(to) + '" data-chg="plan-range"></label></div>' +
      '<div class="presets"><button type="button" class="btn sm" data-act="plan-preset" data-p="week">Angezeigte Woche</button>' +
      '<button type="button" class="btn sm" data-act="plan-preset" data-p="weeks4">4 Wochen</button>' +
      '<button type="button" class="btn sm" data-act="plan-preset" data-p="month">Ganzer Monat</button></div>' +
      '<label class="chk"><input type="checkbox" name="keep" checked> Manuell geänderte Dienste beibehalten</label>' +
      '<p class="note warn" id="planwarn" hidden>Der Zeitraum enthält vergangene Tage. Bereits eingetragene Dienste dort werden überschrieben (außer manuell geänderte).</p>',
    onMount: form => { CHANGE['plan-range'](form.from); },
    onSubmit: form => {
      const from = toDn(form.from.value), to = toDn(form.to.value);
      if (isNaN(from) || isNaN(to) || to < from) { toast('Bitte einen gültigen Zeitraum wählen.', 'bad'); return false; }
      if (to - from > 400) { toast('Der Zeitraum ist zu lang (höchstens etwa 13 Monate).', 'bad'); return false; }
      const keep = form.keep.checked;
      setTimeout(() => runPlan(from, to, keep), 30);
    },
  });
};
ACTIONS['plan-preset'] = el => {

async function runPlan(from, to, keepManual) {
  const weeks = weeksOf(from, to);
  pushUndo();
  showBusy('Dienstplan wird erstellt …');
  await nextTick();
  try {
    for (let i = 0; i < weeks.length; i++) {
      $('.busy-msg', $('#busy')).textContent = weeks.length > 1 ? 'Woche ' + (i + 1) + ' von ' + weeks.length + ' wird geplant …' : 'Dienstplan wird erstellt …';
      await nextTick();
      planWeek(weeks[i], { from, to, keepManual });
    }
  } catch (e) {
    console.error(e);
    hideBusy();
    toast('Beim Planen ist ein Fehler aufgetreten: ' + e.message, 'bad');
    return;
  }
  hideBusy();
  if (ui.ws < mondayOf(from) || ui.ws > to) ui.ws = mondayOf(from);
  afterChange();
  let cover = 0, other = 0;
  for (const ws of weeks) for (const i of checkWeek(ws)) {
    if (i.dn == null || i.dn < from || i.dn > to) continue; // nur der geplante Zeitraum
    if (i.type === 'cover' || i.type === 'minp') cover++; else other++;
  }
  if (cover || other) toast('Plan erstellt, aber mit ' + (cover + other) + ' Hinweis(en): Personal reicht nicht für alle Vorgaben. Siehe „Hinweise“.', 'bad');
  else toast(weeks.length > 1 ? weeks.length + ' Wochen geplant. Alle Vorgaben erfüllt.' : 'Woche geplant. Alle Vorgaben erfüllt.');
}

function monthStats(emp, y, m) {
  const a = monthStart(y, m), b = monthEnd(y, m), win = empWindow(emp);
  const recs = empDayRecords(emp, a, b);
  return { recs, t: sumRecords(recs), acc: empAccount(emp, b), vac: vacationInfo(emp, b), active: win.a <= b && win.b >= a };
}

// Neue Mitarbeiter: Resturlaub folgt dem Anspruch, solange er nicht von Hand geändert wurde
function syncVacRest(form, newVac) {
  if (form.dataset.isnew !== '1') return;
  const r = form.elements.vacRest;
  if (+r.value === +form.dataset.vac) r.value = newVac;
  form.dataset.vac = newVac;
}
// Mitarbeiter-Objekt aus den (noch nicht gespeicherten) Formularwerten, für Vorschau und Hinweise
function formEmp(form) {
  const base = getEmp(form.dataset.emp) || newEmployee('Vollzeit', { id: form.dataset.emp });
  const stand = toDn(form.elements.standDate.value), E = form.elements;
  return Object.assign({}, base, {
    weekly: +E.weekly.value || 0, days: Math.round(+E.days.value) || 5, vac: +E.vac.value || 0,
    offDays: $$('input[name=off]:checked', form).map(x => +x.value), from: E.from.value, to: E.to.value,
    trackFrom: isNaN(stand) ? base.trackFrom : fromDn(stand + 1),
    vacRest: E.vacRest.value === '' ? null : +E.vacRest.value, balStart: +E.balStart.value || 0, vacCarry: 0, vacUsedBefore: 0,
  });
}
// Urlaubsabrechnung beim Austritt als Text
function settlementHtml(v, exitDn) {
  const rest = v.rest;
  const verdict = rest > 0.004 ? '<b class="plus">' + fmtDaysExact(rest) + ' Tage Urlaub sind bei Austritt noch offen (Urlaubsersatzleistung).</b>'
    : rest < -0.004 ? '<b class="minus">' + fmtDaysExact(-rest) + ' Tage mehr Urlaub genommen, als bis zum Austritt zustehen.</b>' : '<b>Der Urlaub ist genau aufgebraucht.</b>';
  return '<b>Urlaubsabrechnung zum Austritt am ' + fmtDate(exitDn) + '</b><br>Urlaubsjahr ' + fmtDate(v.yStart) + ' bis ' + fmtDate(v.yEnd) + ': Jahresanspruch ' + fmtDays(v.fullEntitlement) +
    ' Tage, aliquot für ' + v.daysWorked + ' von ' + v.daysInYear + ' Tagen = <b>' + fmtDaysExact(v.entitlement) + ' Tage</b>' + (v.carry ? ' · Übertrag aus früheren Urlaubsjahren ' + fmtDaysExact(v.carry) + ' Tage' : '') +
    ' · genommen ' + fmtDaysExact(v.used) + ' Tage<br>' + verdict + ' <span class="muted">Rundung und rechtliche Prüfung bitte mit der Lohnverrechnung abstimmen.</span>';
}
// Warnungen im Formular: Lücke seit dem Stand, Urlaubsabrechnung bei eingetragenem Austritt
function updateHints(form) {
  const emp = formEmp(form), stand = toDn(form.elements.standDate.value);
  const hint = form.querySelector('#standHint'), box = form.querySelector('#exitBox');
  if (hint) {
    const g = standGap(emp, stand, todayDn());
    if (!g || g.saldo > -4) hint.hidden = true;
    else {
      hint.hidden = false;
      hint.innerHTML = '<b>Achtung:</b> Zwischen dem Stand (' + fmtDate(stand) + ') und gestern liegen ' + g.days + ' Tage. Dafür rechnet das Programm ' + fmtH(g.soll) + ' Std. Soll, eingetragen sind aber nur ' + fmtH(g.ist) + ' Std. Das ergibt ' + fmtSigned(g.saldo) + ' Std. Besser: den Stand auf den Tag vor dem ersten Programmtag legen oder die bisherigen Dienste im Dienstplan nachtragen.';
    }
  }
  if (box) {
    const ex = toDn(form.elements.to.value), v = isNaN(ex) ? null : vacationSettlement(emp, ex);
    box.hidden = !form.elements.to.value;
    if (!box.hidden) box.innerHTML = v ? settlementHtml(v, ex) : 'Für das Austrittsdatum ist noch keine Urlaubsberechnung möglich (Eintritt bzw. Stand prüfen).';
  }
}
function standPreview(e) {
  const t = todayDn(), win = empWindow(e);
  if (win.a > t) return 'Das Programm beginnt am ' + fmtDate(win.a) + ' zu zählen.';
  const acc = empAccount(e, t), vi = vacationInfo(e, t);
  let s = '<b>Aktuell laut Programm (heute):</b> Resturlaub ' + (vi ? (vi.final ? fmtDaysExact(vi.rest) : fmtDays(vi.rest)) : '–') + ' Tage · Zeitkonto ' + fmtSigned(acc.konto) + ' Std.';
  if (vi && !vi.final) {
    const next = vi.yEnd + 1;
    if (next <= win.b) s += '<br>Nächste Gutschrift: +' + fmtDays(e.vac) + ' Tage am ' + fmtDate(next) + ' (Jahrestag des Eintritts).';
  }
  return s;
}

    onMount: form => { form.dataset.isnew = isNew ? '1' : '0'; form.dataset.days = e.days; form.dataset.vac = e.vac; form.dataset.emp = e.id; updateHints(form); },
    onSubmit: form => {
      const v = n => form.elements[n].value;
      const name = v('name').trim();
      if (!name) { toast('Bitte einen Namen eintragen.', 'bad'); form.elements.name.focus(); return false; }
      const weekly = +v('weekly'), days = Math.round(+v('days'));
      if (!(weekly >= 0 && weekly <= 80)) { toast('Die Wochenstunden müssen zwischen 0 und 80 liegen.', 'bad'); return false; }
      if (!(days >= 1 && days <= 7)) { toast('Die Arbeitstage pro Woche müssen zwischen 1 und 7 liegen.', 'bad'); return false; }
      if (!v('from')) { toast('Bitte das Eintrittsdatum angeben. Es bestimmt, wann jährlich neuer Urlaub hinzukommt.', 'bad'); form.elements.from.focus(); return false; }
      if (v('to') && v('to') < v('from')) { toast('Der Austritt liegt vor dem Eintritt.', 'bad'); return false; }
      const stand = toDn(v('standDate'));
      if (isNaN(stand)) { toast('Bitte das Datum angeben, für das Resturlaub und Plus-/Minusstunden gelten (Stand per).', 'bad'); form.elements.standDate.focus(); return false; }
      if (v('vacRest') === '' || isNaN(+v('vacRest'))) { toast('Bitte den Resturlaub per Stand eintragen (0 ist erlaubt).', 'bad'); form.elements.vacRest.focus(); return false; }
      const allowed = $$('input[name=allowed]:checked', form).map(x => x.value);
      if (!allowed.length) { toast('Mindestens ein Dienst muss erlaubt sein.', 'bad'); return false; }
      const main = v('main');
      const data = {
        name, type: v('type'), weekly, days, vac: +v('vac') || 0,
        main, alt: $$('input[name=alt]:checked', form).map(x => x.value).filter(x => x !== main),
        allowed: allowed.length === S.shifts.length ? null : allowed,
        offDays: $$('input[name=off]:checked', form).map(x => +x.value),
        from: v('from'), to: v('to'), active: !(v('to') && toDn(v('to')) < todayDn()), trackFrom: fromDn(stand + 1),
        balStart: +v('balStart') || 0, vacRest: +v('vacRest'), vacCarry: 0, vacUsedBefore: 0, note: v('note').trim(),
      };
      let removed = 0;
      mutate(() => {
        if (isNew) state.employees.push(newEmployee(data.type, data));
        else Object.assign(getEmp(id), data);
        if (data.to) removed = removeAfter(isNew ? state.employees[state.employees.length - 1].id : id, toDn(data.to));
      });
      toast(removed ? 'Gespeichert. ' + removed + ' Dienst(e) nach dem Austritt wurden entfernt.' : isNew ? 'Mitarbeiter angelegt' : 'Gespeichert');
    },
  });
}

VIEWS.abs = function () {
  const y = ui.absYear, ef = ui.absEmp;
  const from = dnOf(y, 1, 1), to = dnOf(y, 12, 31);
  const list = state.absences
    .filter(a => (!ef || a.emp === ef) && getEmp(a.emp) && toDn(a.to) >= from && toDn(a.from) <= to)
    .sort((a, b) => toDn(a.from) - toDn(b.from) || getEmp(a.emp).name.localeCompare(getEmp(b.emp).name, 'de'));
  const rows = list.map(a => {
    const e = getEmp(a.emp), f = toDn(a.from), t = toDn(a.to);
    let days = 0;
    for (const r of empDayRecords(e, f, t)) if (r.abs === a.type && ((a.type === 'urlaub' && r.vac) || (a.type === 'krank' && r.sick) || (a.type === 'za' && r.za) || (a.type === 'frei' && r.cat === 'frei'))) days++;
    const cal = t - f + 1;
    return '<tr class="click" data-act="abs-edit" data-id="' + a.id + '"><td><b>' + esc(e.name) + '</b></td><td><span class="abadge a-' + a.type + '">' + esc(ABS_TYPES[a.type]) + '</span></td>' +
      '<td>' + WD_SHORT[wdOf(f)] + ' ' + fmtDate(f) + '</td><td>' + WD_SHORT[wdOf(t)] + ' ' + fmtDate(t) + '</td>' +
      '<td class="r" title="' + cal + ' Kalendertage im Zeitraum">' + (a.type === 'frei' ? '–' : days) + '</td><td class="muted">' + esc(a.note || '') + '</td></tr>';
  }).join('');
  const yearOpts = []; for (let yy = ymd(todayDn()).y - 2; yy <= ymd(todayDn()).y + 2; yy++) yearOpts.push(opt(yy, yy, yy === y));
  return '<div class="toolbar no-print"><div class="filters">' +
    '<label>Jahr <select data-chg="abs-year">' + yearOpts.join('') + '</select></label>' +
    '<label>Mitarbeiter <select data-chg="abs-emp">' + opt('', 'Alle', !ef) + state.employees.map(e => opt(e.id, e.name, e.id === ef)).join('') + '</select></label></div>' +
    '<div class="tools"><button class="btn primary" data-act="abs-new">+ Abwesenheit eintragen</button></div></div>' +
    '<section class="card"><h3>Urlaub, Krankenstand und Zeitausgleich</h3>' +
    (rows ? '<div class="tablewrap"><table class="list"><thead><tr><th>Mitarbeiter</th><th>Art</th><th>Von</th><th>Bis</th><th class="r">Tage (angerechnet)</th><th>Notiz</th></tr></thead><tbody>' + rows + '</tbody></table></div>'
      : '<p class="muted pad">Für ' + y + ' sind keine Abwesenheiten eingetragen.</p>') +
    '<p class="tip">Die automatische Planung teilt an diesen Tagen niemanden ein. Angerechnet werden nur Tage, an denen die Person laut Arbeitstagen pro Woche und freien Tagen gearbeitet hätte; Feiertage zählen nicht als Urlaub. Krankenstand und Urlaub werden mit den Tagesstunden gutgeschrieben, Zeitausgleich baut Plusstunden ab.</p></section>';
};

    '<label class="fld full">Art<select name="type">' + Object.keys(ABS_TYPES).map(t => opt(t, ABS_TYPES[t] + (t === 'frei' ? ' – Wunsch, ohne Gutschrift und ohne Urlaubsabzug' : ''), a.type === t)).join('') + '</select></label>' +

    title: isNew ? 'Abwesenheit eintragen' : 'Abwesenheit bearbeiten', body,

      if (t < f) { toast('Das Ende liegt vor dem Beginn.', 'bad'); return false; }
      if (t - f > 366) { toast('Der Zeitraum darf höchstens ein Jahr umfassen.', 'bad'); return false; }
      const type = form.type.value, note = form.note.value.trim();
      const targets = form.emp.value === '*' ? state.employees.filter(e => e.active !== false).map(e => e.id) : [form.emp.value];
      let removed = 0;
      mutate(() => {
        if (!isNew) {
          state.absences = state.absences.filter(x => x.id !== id);

/* ===== Oberfläche: Monatsauswertung =====
 * Je Mitarbeiter ein Blatt mit Beginn und Ende jedes Tages, am Ende eine Zusammenfassung
 * mit Plus-/Minusstunden und Resturlaub. Gedruckt bzw. als PDF gespeichert wird im Querformat.
 */

function reportEmployees(y, m) {
  const a = monthStart(y, m), b = monthEnd(y, m);
  const order = new Map(state.settings.positions.map((p, i) => [p.id, i]));
  return state.employees.filter(e => {
    const s = monthStats(e, y, m);
    if (!s.active) return false;
    if (e.active !== false) return true;
    return s.t.work > 0 || s.t.credit > 0;
  }).sort((p, q) => (order.has(p.main) ? order.get(p.main) : 99) - (order.has(q.main) ? order.get(q.main) : 99) || p.name.localeCompare(q.name, 'de'));
}

const fmtPause = min => (min ? Math.floor(min / 60) + ':' + p2(min % 60) : '');

function sheetHtml(e, y, m, s) {
  let rows = '';
  for (const r of s.recs) {
    const wd = wdOf(r.dn), holiday = holidayName(r.dn);
    const cls = [];
    if (wd >= 5) cls.push('we');
    if (holiday) cls.push('hd');
    const label = WD_SHORT[wd] + ' ' + p2(ymd(r.dn).d) + '.';
    if (!r.inWin) { rows += '<tr class="na"><td>' + label + '</td><td colspan="5">–</td></tr>'; continue; }
    let von = '', bis = '', pause = '', std = '', note = '';
    if (r.cat === 'work') {
      const ens = r.entries.slice().sort((a, b) => parseHM(a.start) - parseHM(b.start));
      von = ens.map(x => x.start).join(' / ');
      bis = ens.map(x => x.end).join(' / ');
      pause = fmtPause(ens.reduce((t, x) => t + (+x.pause || 0), 0));
      std = fmtH(r.work);
      const names = ens.map(x => (getPos(x.pos) || { name: '?' }).name).filter((n, i, a) => a.indexOf(n) === i);
      note = names.join(', ') + (holiday ? ' · Feiertag' : '');
    } else {
      const map = { urlaub: 'Urlaub', krank: 'Krankenstand', za: 'Zeitausgleich', feiertag: 'Feiertag (Gutschrift)', ruhetag: 'Ruhetag' };
      if (map[r.cat]) note = map[r.cat];
      else if (r.cat === 'nocount') note = (ABS_TYPES[r.abs] || 'Abwesenheit') + ' (nicht angerechnet)';
      else if (holiday) note = 'Feiertag';
      else if (r.cat === 'frei') note = 'frei';
      if (r.credit > 0) std = '(' + fmtH(r.credit) + ')';
      else if (r.cat === 'za') std = '–';
      if (r.cat === 'urlaub' || r.cat === 'krank' || r.cat === 'za' || r.cat === 'feiertag') cls.push('ab');
    }
    rows += '<tr class="' + cls.join(' ') + '"><td>' + label + '</td><td>' + esc(von) + '</td><td>' + esc(bis) + '</td><td>' + pause + '</td><td class="r">' + std + '</td><td class="nt">' + esc(note) + '</td></tr>';
  }
  const t = s.t;
  let foot = '<tr class="sum"><td colspan="4">Gearbeitet (' + t.workDays + ' Tage)</td><td class="r">' + fmtH(t.work) + '</td><td></td></tr>';
  if (t.credit > 0) {
    const parts = [];
    if (t.vacDays) parts.push(t.vacDays + ' Urlaub');
    if (t.sickDays) parts.push(t.sickDays + ' Krank');
    if (t.holDays) parts.push(t.holDays + ' Feiertag');
    foot += '<tr class="sum"><td colspan="4">Gutschrift</td><td class="r">' + fmtH(t.credit) + '</td><td class="nt">' + parts.join(', ') + '</td></tr>';
  }
  return '<div class="sheet"><div class="sh-head"><div><b>' + esc(e.name) + '</b><span>' + esc(e.type) + ' · ' + fmtNum(e.weekly, 1).replace(',0', '') + ' Std./Woche</span></div><div class="sh-per">' + MONTHS[m - 1] + ' ' + y + '</div></div>' +
    '<table><thead><tr><th>Tag</th><th>von</th><th>bis</th><th>Pause</th><th class="r">Std.</th><th>Vermerk</th></tr></thead><tbody>' + rows + '</tbody><tfoot>' + foot + '</tfoot></table></div>';
}

function summaryHtml(y, m, list) {
  let tot = { soll: 0, work: 0, credit: 0, ist: 0, saldo: 0 };
  const rows = list.map(e => {
    const s = monthStats(e, y, m), t = s.t, v = s.vac;
    for (const k in tot) tot[k] += t[k];
    return '<tr><td><b>' + esc(e.name) + '</b><small>' + esc(e.type) + '</small></td><td class="r">' + fmtNum(e.weekly, 1).replace(',0', '') + '</td>' +
      '<td class="r">' + fmtH(t.soll) + '</td><td class="r">' + fmtH(t.work) + '</td><td class="r">' + (t.credit ? fmtH(t.credit) : '–') + '</td><td class="r"><b>' + fmtH(t.ist) + '</b></td>' +
      '<td class="r ' + saldoClass(t.saldo) + '"><b>' + fmtSigned(t.saldo) + '</b></td>' +
      '<td class="r ' + saldoClass(s.acc.konto) + '"><b>' + fmtSigned(s.acc.konto) + '</b></td>' +
      '<td class="r">' + (t.vacDays || '–') + '</td><td class="r">' + (t.sickDays || '–') + '</td>' +
      '<td class="r">' + (v ? (v.final ? fmtDaysExact(v.entitlement + v.carry) : fmtDays(v.entitlement + v.carry)) + '<small>' + (v.final ? 'aliquot bis ' + fmtDM(v.endDay) : 'Jahr ab ' + fmtDM(v.yStart)) + '</small>' : '–') + '</td>' +
      '<td class="r">' + (v ? (v.final ? fmtDaysExact(v.used) : fmtDays(v.used)) : '–') + '</td>' +
      '<td class="r"><b>' + (v ? (v.final ? fmtDaysExact(v.rest) : fmtDays(v.rest)) : '–') + '</b>' +
      (v && v.final ? '<small>' + (v.rest > 0.004 ? 'zur Auszahlung' : v.rest < -0.004 ? 'zu viel genommen' : 'aufgebraucht') + '</small>' : v && v.later ? '<small>' + fmtDays(v.later) + ' danach geplant</small>' : '') + '</td></tr>';
  }).join('');
  return '<table class="sum-table"><thead><tr><th rowspan="2">Mitarbeiter</th><th rowspan="2" class="r">Std./Woche</th>' +
    '<th colspan="5" class="grp">Arbeitszeit im Monat (Std.)</th><th rowspan="2" class="r">Zeitkonto gesamt (Std.)</th>' +
    '<th colspan="2" class="grp">Tage im Monat</th><th colspan="3" class="grp">Urlaub im Urlaubsjahr (Tage)</th></tr>' +
    '<tr><th class="r">Soll</th><th class="r">Gearbeitet</th><th class="r">Gutschrift</th><th class="r">Ist</th><th class="r">Plus / Minus</th>' +
    '<th class="r">Urlaub</th><th class="r">Krank</th><th class="r">Anspruch inkl. Übertrag</th><th class="r">Genommen</th><th class="r">Resturlaub</th></tr></thead>' +
    '<tbody>' + rows + '</tbody><tfoot><tr><td>Summe</td><td></td><td class="r">' + fmtH(tot.soll) + '</td><td class="r">' + fmtH(tot.work) + '</td><td class="r">' + fmtH(tot.credit) + '</td><td class="r">' + fmtH(tot.ist) + '</td><td class="r ' + saldoClass(tot.saldo) + '">' + fmtSigned(tot.saldo) + '</td><td colspan="6"></td></tr></tfoot></table>' +
    '<div class="notes"><b>So wird gerechnet:</b> Soll = Wochenstunden × Kalendertage des Monats ÷ 7. Gearbeitet = Dienste von–bis abzüglich Pause. ' +
    'Gutschrift = Urlaub, Krankenstand und Feiertag/Betriebsruhe mit den Stunden eines durchschnittlichen Arbeitstages (Wochenstunden ÷ Arbeitstage pro Woche). ' +
    'Ist = Gearbeitet + Gutschrift. Plus/Minus = Ist − Soll. Zeitkonto gesamt = Startsaldo + Plus/Minus seit Beginn der Aufzeichnung. ' +
    'Urlaubsjahr = ab dem Jahrestag des Eintritts; an diesem Tag wird der Jahresanspruch neu gutgeschrieben. ' +
    'Resturlaub = Anspruch + Übertrag − genommene Urlaubstage (bis Monatsende); bereits danach geplante Urlaubstage sind gesondert ausgewiesen. ' +
    'Beim Austritt gilt der Anspruch des letzten Urlaubsjahres aliquot (Tage des Arbeitsverhältnisses ÷ Tage des Urlaubsjahres × Jahresanspruch).</div>' + exitBlockHtml(y, m, list);
}

// Urlaubsabrechnung der Mitarbeiter, die in diesem Monat ausscheiden
function exitBlockHtml(y, m, list) {
  const a = monthStart(y, m), b = monthEnd(y, m);
  const rows = list.filter(e => e.to && toDn(e.to) >= a && toDn(e.to) <= b).map(e => {
    const ex = toDn(e.to), v = vacationInfo(e, ex);
    if (!v) return '';
    const res = v.rest;
    return '<tr><td><b>' + esc(e.name) + '</b></td><td>' + fmtDate(ex) + '</td><td>' + fmtDate(v.yStart) + ' – ' + fmtDate(v.yEnd) + '</td><td class="r">' + fmtDays(v.fullEntitlement) + '</td>' +
      '<td class="r">' + v.daysWorked + ' / ' + v.daysInYear + '</td><td class="r"><b>' + fmtDaysExact(v.entitlement) + '</b></td><td class="r">' + fmtDaysExact(v.carry) + '</td><td class="r">' + fmtDaysExact(v.used) + '</td>' +
      '<td class="r ' + (res > 0.004 ? 'plus' : res < -0.004 ? 'minus' : 'zero') + '"><b>' + (res > 0.004 ? fmtDaysExact(res) + ' Tage zur Auszahlung' : res < -0.004 ? fmtDaysExact(-res) + ' Tage zu viel genommen' : 'aufgebraucht') + '</b></td></tr>';
  }).join('');
  if (!rows) return '';
  return '<h3 class="exit-h">Austritte in diesem Monat: Urlaubsabrechnung</h3>' +
    '<table class="sum-table exit"><thead><tr><th>Mitarbeiter</th><th>Austritt</th><th>Urlaubsjahr</th><th class="r">Jahresanspruch</th><th class="r">Tage im Urlaubsjahr</th><th class="r">Anspruch aliquot</th><th class="r">Übertrag Vorjahre</th><th class="r">Genommen</th><th class="r">Ergebnis</th></tr></thead><tbody>' + rows + '</tbody></table>' +
    '<div class="notes">Anspruch aliquot = Jahresanspruch × Tage des Arbeitsverhältnisses im Urlaubsjahr ÷ Tage des Urlaubsjahres. Ergebnis = Übertrag + Anspruch aliquot − genommen. Rundung und rechtliche Prüfung bitte mit der Lohnverrechnung abstimmen.</div>';
}

VIEWS.report = function () {
  const { y, m } = ui.month, S = state.settings;
  const list = reportEmployees(y, m);
  const bar = '<div class="toolbar no-print">' + monthNavHtml() +
    '<div class="tools"><button class="btn primary" data-act="print">Drucken / Als PDF speichern</button></div></div>';
  if (!list.length) return bar + '<section class="card"><p class="muted pad">Für ' + MONTHS[m - 1] + ' ' + y + ' liegen keine Daten vor. Mitarbeiter werden erst ab dem Tag nach ihrem „Stand per“ ausgewertet (siehe Mitarbeiter → Stände übernehmen).</p></section>';
  const created = fmtDate(todayDn());
  const head = '<div class="rp-head"><div><b>' + esc(S.name) + '</b> · Monatsauswertung ' + MONTHS[m - 1] + ' ' + y + '</div><div>Erstellt am ' + created + '</div></div>';
  const stats = new Map(list.map(e => [e.id, monthStats(e, y, m)]));
  let pages = '';
  for (let i = 0; i < list.length; i += 2) {
    pages += '<section class="rpage">' + head + '<div class="sheets">' + list.slice(i, i + 2).map(e => sheetHtml(e, y, m, stats.get(e.id))).join('') + '</div></section>';

function secReq() {
  const S = state.settings;
  let head = '<th>Position</th>';

        '<label title="Mindestens so viele Personen in der Früh-Hälfte">F<input type="number" min="0" max="20" value="' + r[0] + '" data-chg="req" data-p="' + p.id + '" data-k="' + k + '" data-s="0"></label>' +

    '<p class="tip">F = Früh-Hälfte, S = Spät-Hälfte des Tages. Beispiel: „Service F1 S1“ heißt, tagsüber und abends muss jeweils mindestens eine Person im Service sein. Ein durchgehender Dienst zählt für beides. Bei 4 Positionen mit je 1 ergeben sich mindestens 4 Personen pro Tag. Für Stoßzeiten (z. B. Samstag) die Zahl erhöhen.</p></section>';

function secRules() {
  const S = state.settings;

    '<label class="fld">Mindestruhezeit zwischen zwei Diensten (Std.)<input type="number" min="0" max="16" step="0.5" value="' + S.minRestH + '" data-chg="set-rest"><small>Gesetzlicher Regelwert: 11 Stunden. Kollektivvertrag beachten.</small></label>' +

function secHolidays() {
  const S = state.settings, y = ui.holYear;

  const clos = S.closures.slice().sort((a, b) => toDn(a.from) - toDn(b.from)).map(c =>

function secData() {
  let fs;
  if (!fsApi.supported) {
    fs = '<p class="note warn">Dieser Browser (z. B. Firefox oder Safari) kann keinen Datenordner verwenden. Für die dauerhafte Speicherung im Ordner bitte Chrome oder Edge benutzen. Bis dahin liegen die Daten nur im Browser: bitte regelmäßig „Sicherung herunterladen“.</p>';
  } else if (fsApi.dir) {
    const st = fsApi.conflict ? 'Der Ordner enthält abweichende Daten, bitte klären.' : fsApi.ok ? 'Jede Änderung wird automatisch dort gespeichert.' : 'Zurzeit nicht verbunden. Änderungen werden nur im Browser gespeichert, bis die Verbindung wieder erlaubt ist.';
    fs = '<h4>Datenordner</h4><p>Ordner: <b>„' + esc(fsApi.name) + '“</b>. ' + st + '</p>' +
      '<p class="muted">Im Ordner liegt die Datei <code>' + DATA_FILE + '</code> und im Unterordner <code>' + BACKUP_DIR + '</code> je Arbeitstag eine Sicherungskopie (die letzten ' + KEEP_BACKUPS + ').</p>' +
      '<div class="row-btns">' +
      (fsApi.conflict ? '<button class="btn primary" data-act="fs-resolve">Abweichung klären …</button>' : !fsApi.ok ? '<button class="btn primary" data-act="fs-reconnect">Wieder verbinden</button>' : '<button class="btn" data-act="fs-reload">Jetzt aus dem Ordner neu laden</button>') +
      '<button class="btn" data-act="fs-connect">Anderen Ordner wählen …</button><button class="btn" data-act="fs-disconnect">Verbindung trennen</button></div>';
  } else {
    fs = '<h4>Datenordner (empfohlen)</h4><p>Die Daten in einem eigenen Ordner auf dem Computer speichern statt nur im Browser. Darin liegen eine normale Datei mit allen Daten und automatische tägliche Sicherungskopien. Am besten zuerst einen neuen Ordner anlegen (z. B. „Dienstplan-Daten“ in „Dokumente“) und den dann auswählen. Bereits eingegebene Daten werden übernommen.</p>' +
      '<div class="row-btns"><button class="btn primary" data-act="fs-connect">Datenordner wählen …</button></div>';
  }
  return '<section class="card"><h3>Daten und Sicherung</h3>' +
    '<p>Alle Daten bleiben auf diesem Computer, nichts wird ins Internet übertragen. Ohne Datenordner liegen sie nur im Speicher dieses Browsers und sind weg, wenn dieser gelöscht oder ein anderer Browser benutzt wird.</p>' +
    fs +
    '<p><b>Umzug auf einen anderen Computer:</b> Den ganzen Datenordner kopieren (oder in einem Cloud-Ordner ablegen), am neuen Computer die Dienstplan.html öffnen und „Datenordner wählen …“ auswählen. Nicht gleichzeitig auf zwei Computern arbeiten: bei einem Abgleich gilt jeweils der neuere Stand, und es wird vorher gefragt.</p>' +
    '<h4>Sicherung als Einzeldatei (geht in jedem Browser)</h4>' +
    '<div class="row-btns"><button class="btn" data-act="backup">Sicherung herunterladen</button>' +
    '<label class="btn">Sicherung laden …<input type="file" accept=".json,application/json" hidden data-chg="restore-file"></label></div>' +
    '<h4>Sonstiges</h4><div class="row-btns"><button class="btn danger ghost" data-act="reset-all">Alle Daten löschen</button></div></section>';
}

CHANGE['set-name'] = el => mutate(() => { state.settings.name = el.value.trim() || COMPANY_NAME; });
CHANGE['set-open'] = el => mutate(() => { state.settings.openDays[+el.dataset.k] = el.checked; });
CHANGE['set-minp'] = el => mutate(() => { state.settings.minPersons = clamp(Math.round(+el.value || 1), 1, 50); });
CHANGE['set-rest'] = el => mutate(() => { state.settings.minRestH = clamp(+el.value || 0, 0, 16); });
CHANGE['set-consec'] = el => mutate(() => { state.settings.maxConsec = clamp(Math.round(+el.value || 6), 1, 7); });
CHANGE['set-fair'] = el => mutate(() => { state.settings.fairWeekends = el.checked; });
CHANGE['hol-year'] = el => { ui.holYear = +el.value; render(); };
CHANGE['hol-closed'] = el => mutate(() => { if (el.checked) state.settings.closedHolidays[el.dataset.iso] = true; else delete state.settings.closedHolidays[el.dataset.iso]; });
CHANGE.req = el => mutate(() => { state.settings.req[el.dataset.p][+el.dataset.k][+el.dataset.s] = clamp(Math.round(+el.value || 0), 0, 20); });

CHANGE['pos-color'] = el => mutate(() => { getPos(el.dataset.id).color = el.value; });
CHANGE['pos-name'] = el => mutate(() => { getPos(el.dataset.id).name = el.value.trim() || 'Position'; });
ACTIONS['pos-add'] = () => {
  const id = uid('pos_');
  mutate(() => {
    const S = state.settings;
    S.positions.push({ id, name: 'Neue Position', color: POS_COLORS[S.positions.length % POS_COLORS.length] });
    ensureReq(S);
  });
  const el = $('[data-key="pos-' + id + '"]');
  if (el) { el.focus(); el.select(); }
};
ACTIONS['pos-del'] = el => {
  const id = el.dataset.id, S = state.settings;
  const used = state.employees.some(e => e.main === id || (e.alt || []).indexOf(id) >= 0) || Object.keys(state.plan).some(d => state.plan[d].some(en => en.pos === id));
  if (used) { toast('Diese Position wird noch von Mitarbeitern oder in Diensten verwendet und kann nicht gelöscht werden. Sie lässt sich aber umbenennen.', 'bad'); return; }
  if (S.positions.length <= 1) { toast('Mindestens eine Position ist nötig.', 'bad'); return; }
  mutate(() => { S.positions = S.positions.filter(p => p.id !== id); delete S.req[id]; });
};

CHANGE['sh-field'] = el => {
  const sh = getShift(el.dataset.id), f = el.dataset.f;
  let val = el.value;
  if (f === 'name') val = val.trim() || 'Dienst';
  else if (f === 'pause') val = clamp(Math.round(+val || 0), 0, 600);
  else if (f === 'start' || f === 'end') { if (isNaN(parseHM(val))) { render(); return; } }
  const test = Object.assign({}, sh, { [f]: val });
  if (f === 'start' || f === 'end' || f === 'pause') {
    const net = netHours(test.start, test.end, test.pause);
    if (test.start === test.end) { toast('Beginn und Ende dürfen nicht gleich sein.', 'bad'); render(); return; }
    if (!(net > 0)) { toast('Beginn, Ende und Pause ergeben keine positive Arbeitszeit.', 'bad'); render(); return; }
    if (net > 16) { toast('Ein Dienst von mehr als 16 Stunden ist nicht zulässig.', 'bad'); render(); return; }
  }
  mutate(() => { sh[f] = val; });
};
ACTIONS['sh-add'] = () => {
  const id = uid('sh_');
  mutate(() => { state.settings.shifts.push({ id, name: 'Neuer Dienst', start: '12:00', end: '18:00', pause: 30, covers: 'F' }); });
  const el = $('[data-key="sh-name-' + id + '"]');
  if (el) { el.focus(); el.select(); }
};
ACTIONS['sh-del'] = el => {
  const S = state.settings;
  if (S.shifts.length <= 1) { toast('Mindestens ein Dienst ist nötig.', 'bad'); return; }
  const id = el.dataset.id;
  mutate(() => {
    S.shifts = S.shifts.filter(s => s.id !== id);
    state.employees.forEach(e => { if (e.allowed) { e.allowed = e.allowed.filter(x => x !== id); if (!e.allowed.length) e.allowed = null; } });
  });
};

ACTIONS['clos-add'] = () => openModal({
  title: 'Betriebsruhe eintragen',
  body: '<div class="grid2"><label class="fld">Von<input type="date" name="from" required></label><label class="fld">Bis (einschließlich)<input type="date" name="to" required></label>' +
    '<label class="fld full">Bezeichnung<input type="text" name="note" placeholder="z. B. Betriebsurlaub Sommer" value="Betriebsurlaub"></label></div>',
  onSubmit: form => {
    const f = toDn(form.from.value), t = toDn(form.to.value);
    if (isNaN(f) || isNaN(t) || t < f) { toast('Bitte einen gültigen Zeitraum eintragen.', 'bad'); return false; }
    mutate(() => { state.settings.closures.push({ id: uid('c'), from: fromDn(f), to: fromDn(t), note: form.note.value.trim() || 'Betriebsruhe' }); });
  },
});
ACTIONS['clos-del'] = el => mutate(() => { state.settings.closures = state.settings.closures.filter(c => c.id !== el.dataset.id); });

/* ---------- Daten ---------- */

CHANGE['restore-file'] = el => {
  const f = el.files && el.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => restoreFromText(String(r.result));
  r.readAsText(f);
  el.value = '';
};
ACTIONS['fs-connect'] = () => fsConnect();
ACTIONS['fs-disconnect'] = () => fsDisconnect();
ACTIONS['fs-reload'] = () => fsSync(true);
ACTIONS['fs-resolve'] = () => fsConflictPrompt();
ACTIONS['fs-adopt'] = () => { closeModal(); fsAdoptFolder(); };
ACTIONS['fs-overwrite'] = () => { closeModal(); fsOverwriteFolder(); };
ACTIONS['reset-all'] = () => confirmBox('Wirklich ALLE Daten (Mitarbeiter, Pläne, Einstellungen) löschen? Ist ein Datenordner verbunden, wird der bisherige Stand dort im Unterordner „Sicherungen“ aufgehoben.', 'Alles löschen', () => {
  fsSafetyCopy('vor-Loeschen');
  pushUndo();
  state = defaultState();
  afterChange();
  toast('Alle Daten gelöscht');
}, true);

/* ===== Start ===== */

(function init() {
  loadMeta();
  state = loadFromStorage() || defaultState();
  touch();
  let storageOk = true;
  try { localStorage.setItem('dienstplan.test', '1'); localStorage.removeItem('dienstplan.test'); } catch (e) { storageOk = false; }
  render();
  if (!storageOk) toast('Der Browser erlaubt kein Speichern (privates Fenster?). Bitte ein normales Fenster verwenden oder regelmäßig eine Sicherung herunterladen.', 'bad');
  fsInit();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* egal */ }
})();

// Muster-Mitarbeiter aus früheren Versionen (Beispieldaten) auf Wunsch entfernen
function offerSampleCleanup() {
  if (meta.sampleIgnored || $('#modal-root').firstChild) return;
  const list = legacySampleEmployees();
  if (!list.length) return;
  openModal({
    title: 'Muster-Mitarbeiter entfernen', noFocus: true, danger: true, submitLabel: 'Muster-Mitarbeiter entfernen',
    body: '<p class="confirm-text">In den gespeicherten Daten befinden sich noch Muster-Mitarbeiter aus den früheren Beispieldaten:</p>' +
      '<p><b>' + list.map(e => esc(e.name)).join(', ') + '</b></p>' +
      '<p class="muted">Sie werden samt ihren Diensten und Urlauben vollständig entfernt. Alle anderen Mitarbeiter bleiben unverändert.</p>',
    extraHtml: '<button type="button" class="btn ghost" data-act="sample-ignore">Nicht mehr fragen</button>',
    onSubmit: () => { mutate(() => deleteEmployees(list.map(e => e.id))); toast(list.length + ' Muster-Mitarbeiter entfernt'); },
  });
}
ACTIONS['sample-ignore'] = () => { meta.sampleIgnored = true; saveMeta(); closeModal(); };
setTimeout(offerSampleCleanup, 250);

window.addEventListener('error', ev => { console.error(ev.error || ev.message); });

</script>
